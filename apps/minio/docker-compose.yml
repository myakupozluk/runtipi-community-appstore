name: minio
services:
  minio:
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command:
    - server
    - /data
    - --console-address=:5000
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/minio_miniodata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  miniodata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
