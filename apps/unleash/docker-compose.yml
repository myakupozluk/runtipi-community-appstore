name: unleash
services:
  unleash:
    image: unleashorg/unleash-server:8.0.0
    restart: unless-stopped
    environment:
      HTTP_PORT: '5000'
      HTTP_HOST: 0.0.0.0
      DATABASE_URL: postgres://unleash:unleash-local-only@db:5432/unleash
      DATABASE_SSL: ${DATABASE_SSL:-}
      INIT_ADMIN_API_TOKENS: ${INIT_ADMIN_API_TOKENS:-}
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash-local-only
      POSTGRES_DB: unleash
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
