name: letta
services:
  letta:
    image: letta/letta:0.16.8
    restart: unless-stopped
    environment:
      LETTA_PG_URI: postgresql://letta:letta-local-only@db:5432/letta
      SECURE: 'true'
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: '5000'
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    ports:
    - '5432'
    build: ./db
    image: miget-letta-pgvector:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta-local-only
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: letta
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
