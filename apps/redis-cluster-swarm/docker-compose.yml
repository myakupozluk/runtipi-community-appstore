services:
  redis-node-0:
    image: docker.io/bitnami/redis-cluster:6.2
    volumes:
    - ${APP_DATA_DIR}/redis-node-0_redis-cluster_data-0:/bitnami/redis/data
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWD}
    - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  redis-node-1:
    image: docker.io/bitnami/redis-cluster:6.2
    volumes:
    - ${APP_DATA_DIR}/redis-node-1_redis-cluster_data-1:/bitnami/redis/data
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWD}
    - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2
    restart: unless-stopped
    networks:
    - tipi_main_network
  redis-node-2:
    image: docker.io/bitnami/redis-cluster:6.2
    volumes:
    - ${APP_DATA_DIR}/redis-node-2_redis-cluster_data-2:/bitnami/redis/data
    depends_on:
    - redis-node-0
    - redis-node-1
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWD}
    - REDISCLI_AUTH=${REDIS_PASSWD}
    - REDIS_CLUSTER_REPLICAS=0
    - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2
    - REDIS_CLUSTER_CREATOR=yes
    restart: unless-stopped
    networks:
    - tipi_main_network
volumes:
  redis-cluster_data-0: null
  redis-cluster_data-1: null
  redis-cluster_data-2: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
