name: openclaw
services:
  openclaw:
    image: coollabsio/openclaw:2026.7.1
    restart: unless-stopped
    environment:
      PORT: '5000'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_ALLOWED_ORIGINS: ${OPENCLAW_ALLOWED_ORIGINS:-}
    volumes:
    - ${APP_DATA_DIR}/openclaw_openclawdata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  openclawdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
