name: directus
services:
  directus:
    image: directus/directus:11
    restart: unless-stopped
    environment:
      PORT: '5000'
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus-local-only
    volumes:
    - ${APP_DATA_DIR}/directus_uploads:/directus/uploads
    depends_on:
    - db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus-local-only
      POSTGRES_DB: directus
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  uploads: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
