services:
  lidify-backend:
    image: chevron7locked/lidify:latest
    restart: unless-stopped
    environment:
    - DATABASE_URL=postgresql://${POSTGRES_USER:-lidifydb}:${POSTGRES_PASSWORD:-changeme}@lidify-postgres:5432/${POSTGRES_DB:-lidify}
    - POSTGRES_USER=${POSTGRES_USER:-lidifydb}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    - POSTGRES_DB=${POSTGRES_DB:-lidify}
    - REDIS_URL=redis://lidify-redis:6379
    - PORT=3006
    - NODE_ENV=${NODE_ENV:-production}
    - SESSION_SECRET=${SESSION_SECRET:-changeme-generate-secure-key}
    - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
    - MUSIC_PATH=/music
    - TRANSCODE_CACHE_PATH=/app/cache/transcodes
    - TRANSCODE_CACHE_MAX_GB=${TRANSCODE_CACHE_MAX_GB:-10}
    - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3030}
    - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-lidify-internal-secret-change-me}
    - LIDIFY_CALLBACK_URL=${LIDIFY_CALLBACK_URL:-http://lidify-backend:3006}
    - PODCAST_DEBUG=${PODCAST_DEBUG:-0}
    volumes:
    - ${APP_DATA_DIR}/lidify-backend_${MUSIC_PATH}:/music
    - ${APP_DATA_DIR}/lidify-backend_portainer_Files_AppData_Config_lidify_backend-cache:/app/cache
    - ${APP_DATA_DIR}/lidify-backend_portainer_Files_AppData_Config_lidify_backend-logs:/app/logs
    depends_on:
      lidify-postgres:
        condition: service_healthy
      lidify-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - healthcheck.js
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - lidify-network
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3006
  lidify-frontend:
    image: chevron7locked/lidify-frontend:latest
    restart: unless-stopped
    ports:
    - ${FRONTEND_PORT:-3030}:3030
    environment:
    - NODE_ENV=${NODE_ENV:-production}
    - BACKEND_URL=${BACKEND_URL:-http://lidify-backend:3006}
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    - NEXT_PUBLIC_BUILD_TYPE=${NEXT_PUBLIC_BUILD_TYPE:-nightly}
    depends_on:
    - lidify-backend
    healthcheck:
      test:
      - CMD
      - node
      - healthcheck.js
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - lidify-network
    - tipi_main_network
    volumes: []
  lidify-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-lidifydb}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    - POSTGRES_DB=${POSTGRES_DB:-lidify}
    volumes:
    - ${APP_DATA_DIR}/lidify-postgres_portainer_Files_AppData_Config_lidify_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-lidifydb} -d ${POSTGRES_DB:-lidify}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - lidify-network
    - tipi_main_network
  lidify-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/lidify-redis_portainer_Files_AppData_Config_lidify_redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - lidify-network
    - tipi_main_network
  lidify-audio-analyzer:
    image: chevron7locked/lidify-audio-analyzer:latest
    restart: unless-stopped
    environment:
    - REDIS_URL=redis://lidify-redis:6379
    - DATABASE_URL=postgresql://${POSTGRES_USER:-lidifydb}:${POSTGRES_PASSWORD:-changeme}@lidify-postgres:5432/${POSTGRES_DB:-lidify}
    - MUSIC_PATH=/music
    - BATCH_SIZE=${AUDIO_ANALYSIS_BATCH_SIZE:-10}
    - SLEEP_INTERVAL=${AUDIO_ANALYSIS_INTERVAL:-5}
    - BRPOP_TIMEOUT=${AUDIO_BRPOP_TIMEOUT:-30}
    - MODEL_IDLE_TIMEOUT=${AUDIO_MODEL_IDLE_TIMEOUT:-300}
    - NUM_WORKERS=${AUDIO_ANALYSIS_WORKERS:-2}
    - THREADS_PER_WORKER=${AUDIO_ANALYSIS_THREADS_PER_WORKER:-1}
    volumes:
    - ${APP_DATA_DIR}/lidify-audio-analyzer_${MUSIC_PATH}:/music
    depends_on:
      lidify-postgres:
        condition: service_healthy
      lidify-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4'
        reservations:
          memory: 2G
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - python.*analyzer
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - lidify-network
    - tipi_main_network
  lidify-audio-analyzer-clap:
    image: chevron7locked/lidify-audio-analyzer-clap:latest
    restart: unless-stopped
    environment:
    - REDIS_URL=redis://lidify-redis:6379
    - DATABASE_URL=postgresql://${POSTGRES_USER:-lidifydb}:${POSTGRES_PASSWORD:-changeme}@lidify-postgres:5432/${POSTGRES_DB:-lidify}
    - BACKEND_URL=http://lidify-backend:3006
    - MUSIC_PATH=/music
    - SLEEP_INTERVAL=${CLAP_SLEEP_INTERVAL:-5}
    - NUM_WORKERS=${CLAP_WORKERS:-2}
    - THREADS_PER_WORKER=${CLAP_THREADS_PER_WORKER:-1}
    - MODEL_IDLE_TIMEOUT=${CLAP_MODEL_IDLE_TIMEOUT:-300}
    - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-lidify-internal-secret-change-me}
    volumes:
    - ${APP_DATA_DIR}/lidify-audio-analyzer-clap_${MUSIC_PATH}:/music
    depends_on:
      lidify-postgres:
        condition: service_healthy
      lidify-redis:
        condition: service_healthy
      lidify-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '4'
        reservations:
          memory: 1G
    networks:
    - lidify-network
    - tipi_main_network
networks:
  lidify-network:
    driver: bridge
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
