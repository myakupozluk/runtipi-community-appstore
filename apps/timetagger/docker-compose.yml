services:
  timetagger:
    image: ghcr.io/almarklein/timetagger
    volumes:
    - ${APP_DATA_DIR}/timetagger_portainer_Files_AppData_Config_timetagger:/root/_timetagger
    environment:
    - TIMETAGGER_BIND=0.0.0.0:80
    - TIMETAGGER_DATADIR=/root/_timetagger
    - TIMETAGGER_LOG_LEVEL=info
    - TIMETAGGER_CREDENTIALS=test:$$2a$$08$$0CD1NFiIbancwWsu3se1v.RNR/b7YeZd71yg3cZ/3whGlyU6Iny5i
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
