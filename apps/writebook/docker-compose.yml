name: writebook
services:
  writebook:
    image: ghcr.io/basecamp/writebook:v1.2.0
    restart: unless-stopped
    environment:
      HTTP_PORT: '5000'
      DISABLE_SSL: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    volumes:
    - ${APP_DATA_DIR}/writebook_storage:/rails/storage
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  storage: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
