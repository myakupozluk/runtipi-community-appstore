services:
  cashpilot:
    image: drumsergio/cashpilot:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - TZ=UTC
    - CASHPILOT_SECRET_KEY=
    - CASHPILOT_API_KEY=
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
