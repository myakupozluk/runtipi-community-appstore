name: hasura
services:
  hasura:
    image: hasura/graphql-engine:v2.49.2
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_SERVER_PORT: '5000'
      HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:hasura-local-only@db:5432/hasura
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_DEV_MODE: 'false'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasura
      POSTGRES_PASSWORD: hasura-local-only
      POSTGRES_DB: hasura
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
