services:
  airsonic:
    image: linuxserver/airsonic:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=100
    - CONTEXT_PATH=airsonic
    - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
    - ${APP_DATA_DIR}/music:/music
    - ${APP_DATA_DIR}/playlists:/playlists
    - ${APP_DATA_DIR}/podcasts:/podcasts
    - ${APP_DATA_DIR}/media:/media
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4040
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
