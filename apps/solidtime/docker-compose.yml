services:
  solidtime:
    image: solidtime/solidtime:latest
    restart: unless-stopped
    environment:
    - CONTAINER_MODE=http
    - AUTO_DB_MIGRATE=true
    - APP_URL=${APP_URL}
    - APP_KEY=${APP_KEY}
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_ENABLE_REGISTRATION=${APP_ENABLE_REGISTRATION:-false}
    - SUPER_ADMINS=${SUPER_ADMINS}
    - DB_CONNECTION=pgsql
    - DB_HOST=solidtime-postgres
    - DB_PORT=5432
    - DB_DATABASE=${DB_DATABASE:-solidtime}
    - DB_USERNAME=${DB_USERNAME:-solidtime}
    - DB_PASSWORD=${DB_PASSWORD}
    - QUEUE_CONNECTION=database
    - CACHE_STORE=redis
    - SESSION_DRIVER=redis
    - REDIS_HOST=solidtime-redis
    - REDIS_PORT=6379
    - MAIL_MAILER=${MAIL_MAILER:-smtp}
    - MAIL_HOST=${MAIL_HOST}
    - MAIL_PORT=${MAIL_PORT:-587}
    - MAIL_USERNAME=${MAIL_USERNAME}
    - MAIL_PASSWORD=${MAIL_PASSWORD}
    - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@localhost}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME:-solidtime}
    - PASSPORT_PRIVATE_KEY=${PASSPORT_PRIVATE_KEY}
    - PASSPORT_PUBLIC_KEY=${PASSPORT_PUBLIC_KEY}
    - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
    - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    - S3_BUCKET=${S3_BUCKET}
    - S3_ENDPOINT=${S3_ENDPOINT}
    - S3_REGION=${S3_REGION:-us-east-1}
    - S3_USE_PATH_STYLE_ENDPOINT=${S3_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
    - ${APP_DATA_DIR}/solidtime_portainer_Files_AppData_Config_solidtime_storage:/var/www/html/storage
    - ${APP_DATA_DIR}/solidtime_portainer_Files_AppData_Config_solidtime_bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      solidtime-postgres:
        condition: service_healthy
      solidtime-redis:
        condition: service_started
    networks:
    - solidtime-network
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
  solidtime-scheduler:
    image: solidtime/solidtime:latest
    restart: unless-stopped
    environment:
    - CONTAINER_MODE=scheduler
    - APP_URL=${APP_URL}
    - APP_KEY=${APP_KEY}
    - APP_ENV=production
    - DB_CONNECTION=pgsql
    - DB_HOST=solidtime-postgres
    - DB_PORT=5432
    - DB_DATABASE=${DB_DATABASE:-solidtime}
    - DB_USERNAME=${DB_USERNAME:-solidtime}
    - DB_PASSWORD=${DB_PASSWORD}
    - QUEUE_CONNECTION=database
    - CACHE_STORE=redis
    - SESSION_DRIVER=redis
    - REDIS_HOST=solidtime-redis
    - REDIS_PORT=6379
    - MAIL_MAILER=${MAIL_MAILER:-smtp}
    - MAIL_HOST=${MAIL_HOST}
    - MAIL_PORT=${MAIL_PORT:-587}
    - MAIL_USERNAME=${MAIL_USERNAME}
    - MAIL_PASSWORD=${MAIL_PASSWORD}
    - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@localhost}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME:-solidtime}
    - PASSPORT_PRIVATE_KEY=${PASSPORT_PRIVATE_KEY}
    - PASSPORT_PUBLIC_KEY=${PASSPORT_PUBLIC_KEY}
    depends_on:
      solidtime-postgres:
        condition: service_healthy
      solidtime-redis:
        condition: service_started
    networks:
    - solidtime-network
    - tipi_main_network
    volumes: []
  solidtime-worker:
    image: solidtime/solidtime:latest
    restart: unless-stopped
    environment:
    - CONTAINER_MODE=worker
    - APP_URL=${APP_URL}
    - APP_KEY=${APP_KEY}
    - APP_ENV=production
    - DB_CONNECTION=pgsql
    - DB_HOST=solidtime-postgres
    - DB_PORT=5432
    - DB_DATABASE=${DB_DATABASE:-solidtime}
    - DB_USERNAME=${DB_USERNAME:-solidtime}
    - DB_PASSWORD=${DB_PASSWORD}
    - QUEUE_CONNECTION=database
    - CACHE_STORE=redis
    - SESSION_DRIVER=redis
    - REDIS_HOST=solidtime-redis
    - REDIS_PORT=6379
    - MAIL_MAILER=${MAIL_MAILER:-smtp}
    - MAIL_HOST=${MAIL_HOST}
    - MAIL_PORT=${MAIL_PORT:-587}
    - MAIL_USERNAME=${MAIL_USERNAME}
    - MAIL_PASSWORD=${MAIL_PASSWORD}
    - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@localhost}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME:-solidtime}
    - PASSPORT_PRIVATE_KEY=${PASSPORT_PRIVATE_KEY}
    - PASSPORT_PUBLIC_KEY=${PASSPORT_PUBLIC_KEY}
    depends_on:
      solidtime-postgres:
        condition: service_healthy
      solidtime-redis:
        condition: service_started
    networks:
    - solidtime-network
    - tipi_main_network
    volumes: []
  solidtime-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_DB=${DB_DATABASE:-solidtime}
    - POSTGRES_USER=${DB_USERNAME:-solidtime}
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/solidtime-postgres_portainer_Files_AppData_Config_solidtime_postgres:/var/lib/postgresql/data
    networks:
    - solidtime-network
    - tipi_main_network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:-solidtime} -d ${DB_DATABASE:-solidtime}
      interval: 5s
      timeout: 5s
      retries: 5
  solidtime-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/solidtime-redis_portainer_Files_AppData_Config_solidtime_redis:/data
    networks:
    - solidtime-network
    - tipi_main_network
networks:
  solidtime-network:
    driver: bridge
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
