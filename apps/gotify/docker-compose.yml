services:
  gotify:
    image: gotify/server-arm7:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - TZ=America/New_York
    - GOTIFY_DEFAULTUSER_NAME=admin
    - GOTIFY_DEFAULTUSER_PASS=admin123
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
