services:
  redmine:
    image: redmine:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/usr_src_redmine_files:/usr/src/redmine/files
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
