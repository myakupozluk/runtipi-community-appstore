services:
  db:
    image: linuxserver/mariadb
    hostname: mautic-db
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: out=$$(mysqladmin ping -h localhost -P 3306 -u root --password=rootpass
        2>&1); echo $$out | grep 'mysqld is alive' || { echo $$out; exit 1; }
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Athens
    - MYSQL_ROOT_PASSWORD=rootpass
    - MYSQL_DATABASE=mautic
    - MYSQL_USER=mauticuser
    - MYSQL_PASSWORD=mauticpass
    volumes:
    - ${APP_DATA_DIR}/db_portainer_Files_AppData_Config_mautic_db:/config
    restart: always
    networks:
    - tipi_main_network
  mautic:
    image: mautic/mautic:v4
    hostname: mautic
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1
    environment:
    - MAUTIC_DB_HOST=mautic-db
    - MAUTIC_DB_USER=mauticuser
    - MAUTIC_DB_PASSWORD=mauticpass
    - MAUTIC_DB_NAME=mautic
    - MAUTIC_RUN_CRON_JOBS=true
    volumes:
    - ${APP_DATA_DIR}/mautic_portainer_Files_AppData_Config_mautic_data:/var/www/html
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
