services:
  web:
    image: daledavies/jump
    volumes:
    - ${APP_DATA_DIR}/web_portainer_Files_AppData_Config_jumper_backgrounds:/backgrounds
    - ${APP_DATA_DIR}/web_portainer_Files_AppData_Config_jumper_favicon:/favicon
    - ${APP_DATA_DIR}/web_portainer_Files_AppData_Config_jumper_search:/search
    - ${APP_DATA_DIR}/web_portainer_Files_AppData_Config_jumper_sites:/sites
    environment:
      SITENAME: Custom site name
      OWMAPIKEY: 0a1b2c3d4e5f6a7b8c9d0a1b
      LATLONG: 51.509865,-0.118092
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
