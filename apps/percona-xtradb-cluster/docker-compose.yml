name: percona-xtradb-cluster
x-pxc:
  image: percona/percona-xtradb-cluster:8.4
  restart: unless-stopped
  stop_grace_period: 2m
services:
  pxc-node1:
    image: percona/percona-xtradb-cluster:8.4
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLUSTER_NAME: pxc
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/pxc-node1_node1-data:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
  pxc-node2:
    image: percona/percona-xtradb-cluster:8.4
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLUSTER_NAME: pxc
      CLUSTER_JOIN: pxc-node1
    depends_on:
    - pxc-node1
    volumes:
    - ${APP_DATA_DIR}/pxc-node2_node2-data:/var/lib/mysql
    networks:
    - tipi_main_network
  pxc-node3:
    image: percona/percona-xtradb-cluster:8.4
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLUSTER_NAME: pxc
      CLUSTER_JOIN: pxc-node1
    depends_on:
    - pxc-node1
    volumes:
    - ${APP_DATA_DIR}/pxc-node3_node3-data:/var/lib/mysql
    networks:
    - tipi_main_network
volumes:
  node1-data: null
  node2-data: null
  node3-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
