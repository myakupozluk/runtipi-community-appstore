services:
  minecraft:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - EULA=TRUE
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 25565
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
