name: grafana-stack
services:
  grafana:
    build: ./grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: '5000'
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:5000}
    volumes:
    - ${APP_DATA_DIR}/grafana_grafanadata:/var/lib/grafana
    depends_on:
    - prometheus
    - loki
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  prometheus:
    build: ./prometheus
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/prometheus_promdata:/prometheus
    networks:
    - tipi_main_network
  loki:
    image: grafana/loki:3
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/loki_lokidata:/loki
    networks:
    - tipi_main_network
volumes:
  grafanadata: null
  promdata: null
  lokidata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
