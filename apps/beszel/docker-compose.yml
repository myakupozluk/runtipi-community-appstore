services:
  beszel:
    image: henrygd/beszel
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/beszel_portainer_Files_AppData_Config_beszel:/beszel_data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8090
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
