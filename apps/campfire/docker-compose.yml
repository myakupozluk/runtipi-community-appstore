name: campfire
services:
  campfire:
    image: ghcr.io/basecamp/once-campfire:sha-df5ed25
    restart: unless-stopped
    environment:
      HTTP_PORT: '5000'
      DISABLE_SSL: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
    - ${APP_DATA_DIR}/campfire_storage:/rails/storage
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  storage: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
