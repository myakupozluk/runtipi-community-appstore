services:
  bookstack:
    image: linuxserver/bookstack:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - APP_URL=
    - APP_KEY=
    - DB_HOST=
    - DB_PORT=3306
    - DB_USERNAME=
    - DB_PASSWORD=
    - DB_DATABASE=
    - QUEUE_CONNECTION=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
