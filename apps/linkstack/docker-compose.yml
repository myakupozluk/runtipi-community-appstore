services:
  linkstack:
    hostname: linkstack
    image: linkstackorg/linkstack:latest
    environment:
      TZ: Europe/Athens
      SERVER_ADMIN: admin@example.com
      HTTP_SERVER_NAME: example.com
      HTTPS_SERVER_NAME: example.com
      LOG_LEVEL: info
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 8M
    volumes:
    - ${APP_DATA_DIR}/linkstack_linkstack_data:/htdocs
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
volumes:
  linkstack_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/extra/portainer/Files/AppData/Config/linkstack
      o: bind
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
