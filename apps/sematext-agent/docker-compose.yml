services:
  sematext-agent:
    image: sematext/sematext-agent-docker:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - LOGSENE_TOKEN=
    - SPM_TOKEN=
    volumes:
    - ${APP_DATA_DIR}/var_run_docker.sock:/var/run/docker.sock
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
