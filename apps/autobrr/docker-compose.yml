services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    user: 1000:1000
    environment:
    - TZ=Europe/Athens
    volumes:
    - ${APP_DATA_DIR}/autobrr_portainer_Files_AppData_Config_autobrr_config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 7474
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
