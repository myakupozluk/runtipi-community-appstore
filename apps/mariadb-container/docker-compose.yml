services:
  mariadb-container:
    image: mariadb:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - MYSQL_ROOT_PASSWORD=
    volumes:
    - ${APP_DATA_DIR}/var_lib_mysql:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
