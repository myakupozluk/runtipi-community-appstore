services:
  silverstripe:
    image: brettt89/silverstripe-web:8.1-apache
    volumes:
    - ${APP_DATA_DIR}/silverstripe_portainer_Files_AppData_Config_silverstripe:/var/www/html
    depends_on:
    - silverstripe-db
    environment:
    - DOCUMENT_ROOT=/var/www/html/public
    - SS_TRUSTED_PROXY_IPS=*
    - SS_ENVIRONMENT_TYPE=dev
    - SS_DATABASE_SERVER=database
    - SS_DATABASE_NAME=SS_mysite
    - SS_DATABASE_USERNAME=root
    - SS_DATABASE_PASSWORD=
    - SS_DEFAULT_ADMIN_USERNAME=admin
    - SS_DEFAULT_ADMIN_PASSWORD=password
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  silverstripe-db:
    image: mysql:5.7
    environment:
    - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
    - ${APP_DATA_DIR}/silverstripe-db_portainer_Files_AppData_Config_silverstripe_db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
    - tipi_main_network
volumes:
  db-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
