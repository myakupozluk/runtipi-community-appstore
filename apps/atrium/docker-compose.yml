services:
  atrium:
    image: vibralabs/atrium:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - BETTER_AUTH_SECRET=
    - WEB_URL=http://localhost:8080
    - API_URL=http://localhost:8080
    - SECURE_COOKIES=true
    - DATABASE_URL=
    - STORAGE_PROVIDER=local
    - MAX_FILE_SIZE_MB=50
    - RESEND_API_KEY=
    - EMAIL_FROM=
    volumes:
    - ${APP_DATA_DIR}/var_lib_postgresql_data:/var/lib/postgresql/data
    - ${APP_DATA_DIR}/app_uploads:/app/uploads
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
