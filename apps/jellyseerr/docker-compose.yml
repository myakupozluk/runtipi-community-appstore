services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/app_config:/app/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5055
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
