services:
  nut:
    image: dartsteven/nutify:amd64-0.1.0
    privileged: true
    cap_add:
    - SYS_ADMIN
    - SYS_RAWIO
    - MKNOD
    devices:
    - /dev/bus/usb:/dev/bus/usb:rwm
    device_cgroup_rules:
    - c 189:* rwm
    environment:
    - SERVER_NAME=
    - SERVER_PORT=5050
    - SERVER_HOST=0.0.0.0
    - TIMEZONE=
    - ENCRYPTION_KEY=
    - UPS_HOST=
    - UPS_NAME=ups
    - UPS_DRIVER=usbhid-ups
    - UPS_PORT=auto
    - UPS_REALPOWER_NOMINAL=1000
    - UPS_USER=admin
    - UPS_PASSWORD=hunter2
    - UPSCMD_USER=admin
    - UPSCMD_PASSWORD=hunter2
    - LOG=false
    - LOG_LEVEL=DEBUG
    - LOG_WERKZEUG=false
    - ENABLE_LOG_STARTUP=N
    volumes:
    - ${APP_DATA_DIR}/nut_portainer_Files_AppData_Config_nutify_nut_data:/var/run/nut
    - ${APP_DATA_DIR}/nut_portainer_Files_AppData_Config_nutify_logs_logs:/app/nutify/logs
    - ${APP_DATA_DIR}/nut_portainer_Files_AppData_Config_nutify_instance:/app/nutify/instance
    restart: always
    user: root
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3493
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
