services:
  lazylibrarian:
    image: linuxserver/lazylibrarian:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/downloads:/downloads
    - ${APP_DATA_DIR}/books:/books
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5299
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
