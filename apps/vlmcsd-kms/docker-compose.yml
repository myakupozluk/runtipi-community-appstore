services:
  vlmcsd-kms:
    image: mikolatero/vlmcsd:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 1688
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
