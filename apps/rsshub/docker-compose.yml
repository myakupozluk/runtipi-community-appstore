services:
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - ACCESS_KEY=
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 1200
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
