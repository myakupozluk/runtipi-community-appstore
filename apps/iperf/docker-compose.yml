services:
  iperf3:
    restart: unless-stopped
    image: networkstatic/iperf3
    stdin_open: true
    tty: true
    command: -s
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5201
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
