services:
  miniflux-db:
    image: postgres:15
    hostname: miniflux-db
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - miniflux
      timeout: 45s
      interval: 10s
      retries: 10
      start_period: 30s
    user: 1026:100
    volumes:
    - ${APP_DATA_DIR}/miniflux-db_portainer_Files_AppData_Config_minifluxdb:/var/lib/postgresql/data
    environment:
    - POSTGRES_DB=miniflux
    - POSTGRES_USER=minifluxuser
    - POSTGRES_PASSWORD=minifluxpass
    restart: always
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  miniflux:
    image: miniflux/miniflux:latest
    hostname: miniflux
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - /usr/bin/miniflux
      - -healthcheck
      - auto
    user: 1026:100
    ports:
    - 8645:8080
    environment:
    - DATABASE_URL=postgres://minifluxuser:minifluxpass@miniflux-db/miniflux?sslmode=disable
    - RUN_MIGRATIONS=1
    - CREATE_ADMIN=1
    - ADMIN_USERNAME=admin
    - ADMIN_PASSWORD=adminpass
    restart: always
    depends_on:
      miniflux-db:
        condition: service_healthy
    networks:
    - tipi_main_network
    volumes: []
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
