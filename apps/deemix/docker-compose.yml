services:
  deemix:
    image: registry.gitlab.com/bockiii/deemix-docker:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/downloads:/downloads
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6595
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
