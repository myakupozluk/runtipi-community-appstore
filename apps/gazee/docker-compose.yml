services:
  gazee:
    image: linuxserver/gazee:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/comics:/comics
    - ${APP_DATA_DIR}/mylar:/mylar
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
