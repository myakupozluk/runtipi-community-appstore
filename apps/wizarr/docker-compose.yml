services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - APP_URL=https://wizarr.domain.com
    volumes:
    - ${APP_DATA_DIR}/data_database:/data/database
    - ${APP_DATA_DIR}/etc_localtime:/etc/localtime
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5690
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
