services:
  kanboard:
    image: kanboard/kanboard:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/var_www_app_data:/var/www/app/data
    - ${APP_DATA_DIR}/var_www_app_plugins:/var/www/app/plugins
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
