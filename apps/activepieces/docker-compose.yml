services:
  activepieces:
    image: activepieces/activepieces:0.12.2
    restart: unless-stopped
    depends_on:
    - ap-postgres
    - ap-redis
    environment:
    - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
    - AP_API_KEY=superduperlongranDOMpwd
    - AP_ENCRYPTION_KEY=
    - AP_JWT_SECRET=JWT2square_changeme
    - AP_ENVIRONMENT=prod
    - AP_FRONTEND_URL=http://localhost:38080
    - AP_WEBHOOK_TIMEOUT_SECONDS=30
    - AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
    - AP_POSTGRES_DATABASE=activepieces
    - AP_POSTGRES_HOST=postgres
    - AP_POSTGRES_PORT=5432
    - AP_POSTGRES_USERNAME=postgres
    - AP_POSTGRES_PASSWORD=postgresof_changeme
    - AP_EXECUTION_MODE=UNSANDBOXED
    - AP_REDIS_HOST=redis
    - AP_REDIS_PORT=6379
    - AP_SANDBOX_RUN_TIME_SECONDS=600
    - AP_TELEMETRY_ENABLED=false
    - AP_TEMPLATES_SOURCE_URL="https://cloud.activepieces.com/api/v1/flow-templates"
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 80
  ap-postgres:
    image: postgres:14.4
    restart: unless-stopped
    environment:
    - POSTGRES_DB=activepieces
    - POSTGRES_PASSWORD=postgresof_changeme
    - POSTGRES_USER=postgres
    volumes:
    - ${APP_DATA_DIR}/ap-postgres_portainer_Files_AppData_Config_activepieces_postgres_data:/var/lib/postgresql/data
    networks:
    - tipi_main_network
  ap-redis:
    image: redis:7.0.7
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/ap-redis_portainer_Files_AppData_Config_activepieces_redis_data:/data
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
