services:
  sickrage:
    image: linuxserver/sickrage:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PGID=15000
    - PUID=15000
    - TZ=America/Los_Angeles
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/downloads:/downloads
    - ${APP_DATA_DIR}/tv:/tv
    - ${APP_DATA_DIR}/blackhole:/blackhole
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8081
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
