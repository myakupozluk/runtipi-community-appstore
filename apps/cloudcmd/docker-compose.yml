services:
  cloudcmd:
    image: coderaiser/cloudcmd:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/media_host_opt_mediadepot:/media/host/opt/mediadepot
    - ${APP_DATA_DIR}/media_host_media_storage:/media/host/media/storage
    - ${APP_DATA_DIR}/media_host_media_temp:/media/host/media/temp
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
