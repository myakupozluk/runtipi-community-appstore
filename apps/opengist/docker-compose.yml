services:
  opengist:
    image: ghcr.io/thomiceli/opengist:1
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/opengist:/opengist
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6157
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
