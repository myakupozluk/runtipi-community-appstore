services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HTTP_ALLOWED=
    - AUTO_DELETE_EVERY_N_HOURS=24
    - TZ=UTC
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
