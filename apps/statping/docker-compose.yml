services:
  statping:
    image: statping/statping:latest
    restart: always
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/app:/app
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
