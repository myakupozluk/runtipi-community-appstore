services:
  invoice-ninja:
    image: invoiceninja/invoiceninja:alpine-4
    environment:
    - APP_URL=${URL}
    - APP_KEY=${APP_KEY}
    - MULTI_DB_ENABLED=false
    - DB_TYPE=mysql
    - DB_HOST=ninja_db
    - DB_DATABASE=ninja_db
    - DB_USERNAME=invoice_ninja
    - DB_PASSWORD=${DATABASE_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/invoice-ninja_portainer_Files_AppData_Config_Invoice-Ninja_public:/var/app/public
    - ${APP_DATA_DIR}/invoice-ninja_portainer_Files_AppData_Config_Invoice-Ninja_storage:/var/app/storage
    restart: unless-stopped
    depends_on:
    - ninja_db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 9000
  ninja_db:
    image: linuxserver/mariadb
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    - TZ=${TZ}
    - MYSQL_DATABASE=ninja_db
    - MYSQL_USER=invoice_ninja
    - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/ninja_db_portainer_Files_AppData_Config_Invoice-Ninja_DB:/config
    restart: unless-stopped
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
