name: linkwarden
services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.1
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:5000/api/v1/auth}
      DATABASE_URL: postgresql://linkwarden:linkwarden-local-only@db:5432/linkwarden
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      PORT: '5000'
    volumes:
    - ${APP_DATA_DIR}/linkwarden_linkwardendata:/data/data
    depends_on:
    - db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: linkwarden-local-only
      POSTGRES_DB: linkwarden
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  linkwardendata: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
