name: shlink
services:
  shlink:
    image: shlinkio/shlink:4.4.6
    restart: unless-stopped
    environment:
      PORT: '5000'
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:5000}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-false}
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: shlink-local-only
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: shlink-local-only
      POSTGRES_DB: shlink
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
