services:
  facebox:
    image: machinebox/facebox
    restart: unless-stopped
    environment:
    - MB_KEY=${MB_KEY}
    - MB_FACEBOX_DISABLE_RECOGNITION=false
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
