services:
  librespeed:
    image: linuxserver/librespeed:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PASSWORD=PASSWORD
    - CUSTOM_RESULTS=false
    - DB_TYPE=sqlite
    - DB_NAME=DB_NAME
    - DB_HOSTNAME=DB_HOSTNAME
    - DB_USERNAME=DB_USERNAME
    - DB_PASSWORD=DB_PASSWORD
    - DB_PORT=DB_PORT
    - IPINFO_APIKEY=ACCESS_TOKEN
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
