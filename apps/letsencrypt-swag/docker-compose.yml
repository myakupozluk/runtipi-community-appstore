services:
  letsencrypt-swag:
    image: linuxserver/swag:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - EMAIL=-Xms256m -Xmx512m
    - URL=-Xms256m -Xmx512m
    - SUBDOMAINS=www,
    - ONLY_SUBDOMAINS=false
    - DHLEVEL=2048
    - PUID=1000
    - PGID=100
    - VALIDATION=http
    - DNSPLUGIN=http
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
