name: mattermost
services:
  mattermost:
    image: mattermost/mattermost-team-edition:11.8
    restart: unless-stopped
    environment:
      MM_SERVICESETTINGS_LISTENADDRESS: :5000
      MM_SERVICESETTINGS_SITEURL: ${MM_SITE_URL:-http://localhost:5000}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:mattermost-local-only@db:5432/mattermost?sslmode=disable&connect_timeout=10
    volumes:
    - ${APP_DATA_DIR}/mattermost_mmconfig:/mattermost/config
    - ${APP_DATA_DIR}/mattermost_mmdata:/mattermost/data
    - ${APP_DATA_DIR}/mattermost_mmlogs:/mattermost/logs
    - ${APP_DATA_DIR}/mattermost_mmplugins:/mattermost/plugins
    - ${APP_DATA_DIR}/mattermost_mmclientplugins:/mattermost/client/plugins
    - ${APP_DATA_DIR}/mattermost_mmbleve:/mattermost/bleve-indexes
    depends_on:
    - db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: mattermost-local-only
      POSTGRES_DB: mattermost
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  mmconfig: null
  mmdata: null
  mmlogs: null
  mmplugins: null
  mmclientplugins: null
  mmbleve: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
