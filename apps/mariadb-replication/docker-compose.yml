name: mariadb-replication
services:
  mariadb-primary:
    image: mariadb:11.8
    restart: unless-stopped
    command:
    - --log-bin
    - --server-id=1
    - --log-basename=primary
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER:-repl}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD}
    ports:
    - 3306:3306
    volumes:
    - ${APP_DATA_DIR}/mariadb-primary_primary-data:/var/lib/mysql
    networks:
    - tipi_main_network
  mariadb-replica:
    image: mariadb:11.8
    restart: unless-stopped
    command:
    - --server-id=2
    - --read-only=ON
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_MASTER_HOST: mariadb-primary
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER:-repl}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD}
    depends_on:
    - mariadb-primary
    volumes:
    - ${APP_DATA_DIR}/mariadb-replica_replica-data:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
volumes:
  primary-data: null
  replica-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
