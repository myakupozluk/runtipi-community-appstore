name: flowise
services:
  flowise:
    image: flowiseai/flowise:3.1.3
    restart: unless-stopped
    environment:
      PORT: '5000'
      APP_URL: ${APP_URL:-http://localhost:5000}
      JWT_AUTH_TOKEN_SECRET: ${JWT_AUTH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY_OVERWRITE}
      DATABASE_TYPE: postgres
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: flowise
      DATABASE_USER: flowise
      DATABASE_PASSWORD: flowise-local-only
    volumes:
    - ${APP_DATA_DIR}/flowise_flowisedata:/root/.flowise
    depends_on:
    - db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowise
      POSTGRES_PASSWORD: flowise-local-only
      POSTGRES_DB: flowise
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  flowisedata: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
