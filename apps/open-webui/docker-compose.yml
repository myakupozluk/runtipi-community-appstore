name: open-webui
services:
  open-webui:
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://127.0.0.1:5000/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: unless-stopped
    environment:
      PORT: '5000'
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_OLLAMA_API: 'false'
    volumes:
    - ${APP_DATA_DIR}/open-webui_webuidata:/app/backend/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  webuidata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
