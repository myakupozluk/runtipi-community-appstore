services:
  pumperly:
    image: drumsergio/pumperly:latest
    restart: unless-stopped
    environment:
    - DATABASE_URL=postgresql://pumperly:pumperly@postgres:5432/pumperly
    - TZ=UTC
    - PUMPERLY_DEFAULT_COUNTRY=${PUMPERLY_DEFAULT_COUNTRY:-ES}
    - PUMPERLY_CLUSTER_STATIONS=true
    - PUMPERLY_EV_ENABLED=1
    depends_on:
    - postgres
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 3000
  postgres:
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    environment:
    - POSTGRES_DB=pumperly
    - POSTGRES_USER=pumperly
    - POSTGRES_PASSWORD=pumperly
    volumes:
    - ${APP_DATA_DIR}/postgres_postgres-data:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  postgres-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
