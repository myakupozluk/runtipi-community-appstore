name: mssql
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
    - ${APP_DATA_DIR}/mssql_mssqldata:/var/opt/mssql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 1433
volumes:
  mssqldata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
