services:
  ombi:
    image: linuxserver/ombi:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - BASE_URL=/
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3579
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
