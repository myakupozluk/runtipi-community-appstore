name: clickhouse
x-ch:
  build: .
  image: miget-clickhouse:local
  restart: unless-stopped
x-ch-env:
  CLICKHOUSE_USER: app
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DB: app
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
services:
  ch-1:
    build: .
    image: miget-clickhouse:local
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:8123/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      KEEPER_ID: '1'
      REPLICA_NAME: ch-1
    volumes:
    - ${APP_DATA_DIR}/ch-1_chdata-1:/var/lib/clickhouse
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8123
  ch-2:
    build: .
    image: miget-clickhouse:local
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:8123/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      KEEPER_ID: '2'
      REPLICA_NAME: ch-2
    ports:
    - '8123'
    - '9000'
    - '9181'
    - '9234'
    volumes:
    - ${APP_DATA_DIR}/ch-2_chdata-2:/var/lib/clickhouse
    networks:
    - tipi_main_network
  ch-3:
    build: .
    image: miget-clickhouse:local
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:8123/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      KEEPER_ID: '3'
      REPLICA_NAME: ch-3
    ports:
    - '8123'
    - '9000'
    - '9181'
    - '9234'
    volumes:
    - ${APP_DATA_DIR}/ch-3_chdata-3:/var/lib/clickhouse
    networks:
    - tipi_main_network
volumes:
  chdata-1: null
  chdata-2: null
  chdata-3: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
