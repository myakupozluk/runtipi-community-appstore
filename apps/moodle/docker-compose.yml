services:
  moodle-db:
    image: linuxserver/mariadb
    hostname: moodle-db
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: out=$$(mysqladmin ping -h localhost -P 3306 -u root --password=rootpass
        2>&1); echo $$out | grep 'mysqld is alive' || { echo $$out; exit 1; }
    environment:
    - PUID=1026
    - PGID=100
    - TZ=Europe/Athens
    - MYSQL_ROOT_PASSWORD=rootpass
    - MYSQL_DATABASE=moodle
    - MYSQL_USER=moodleuser
    - MYSQL_PASSWORD=moodlepass
    volumes:
    - ${APP_DATA_DIR}/moodle-db_portainer_Files_AppData_Config_moodle_db:/config
    restart: always
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  moodle:
    image: bitnami/moodle:latest
    hostname: moodle
    security_opt:
    - no-new-privileges:true
    ports:
    - 9490:8080
    environment:
    - MOODLE_DATABASE_HOST=moodle-db
    - MOODLE_DATABASE_PORT_NUMBER=3306
    - MOODLE_DATABASE_NAME=moodle
    - MOODLE_DATABASE_USER=moodleuser
    - MOODLE_DATABASE_PASSWORD=moodlepass
    - PHP_MEMORY_LIMIT=512M
    - MOODLE_USERNAME=marius
    - MOODLE_PASSWORD=mariushosting
    - MOODLE_SITE_NAME=Learn With Marius
    volumes:
    - ${APP_DATA_DIR}/moodle_portainer_Files_AppData_Config_moodle_data1:/bitnami/moodle
    - ${APP_DATA_DIR}/moodle_portainer_Files_AppData_Config_moodle_data2:/bitnami/moodledata
    restart: always
    depends_on:
      moodle-db:
        condition: service_healthy
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
