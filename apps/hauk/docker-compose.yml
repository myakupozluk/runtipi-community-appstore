services:
  hauk:
    image: bilde2910/hauk:latest
    hostname: hauk
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    volumes:
    - ${APP_DATA_DIR}/hauk_portainer_Files_AppData_Config_hauk:/etc/hauk
    restart: on-failure
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
