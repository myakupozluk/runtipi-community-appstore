services:
  Aria2-Pro:
    image: p3terx/aria2-pro
    environment:
    - PUID=65534
    - PGID=65534
    - UMASK_SET=022
    - RPC_PORT=6800
    - LISTEN_PORT=6888
    - DISK_CACHE=64M
    - IPV6_MODE=false
    - UPDATE_TRACKERS=true
    - CUSTOM_TRACKER_URL=
    - TZ=Europe/Athens
    volumes:
    - ${APP_DATA_DIR}/Aria2-Pro_portainer_Files_AppData_Config_aria2-pro:/config
    - ${APP_DATA_DIR}/Aria2-Pro_portainer_Downloads:/downloads
    network_mode: bridge
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 1m
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6800
  AriaNg:
    image: p3terx/ariang
    environment:
    - PUID=1000
    - PGID=1000
    - ARIA2RPCPORT=6800
    - RPC_SECRET=P3TERX
    command: --port 6880 --ipv6
    network_mode: bridge
    ports:
    - 6880:6880
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 1m
    networks:
    - tipi_main_network
    volumes: []
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
