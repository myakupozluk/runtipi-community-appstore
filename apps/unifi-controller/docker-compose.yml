services:
  unifi-controller:
    image: linuxserver/unifi-controller:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3478
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
