services:
  remotely:
    image: immybot/remotely:latest
    volumes:
    - ${APP_DATA_DIR}/remotely_portainer_Files_AppData_Config_remotely:/remotely-data
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
