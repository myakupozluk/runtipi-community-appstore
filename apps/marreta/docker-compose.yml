services:
  marreta:
    image: ghcr.io/manualdousuario/marreta:latest
    environment:
    - SITE_NAME=
    - SITE_DESCRIPTION=
    - SITE_URL=
    - LANGUAGE=
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
