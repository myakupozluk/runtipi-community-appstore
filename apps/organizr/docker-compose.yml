services:
  organizr:
    image: linuxserver/organizr
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Athens
    volumes:
    - ${APP_DATA_DIR}/organizr_portainer_Files_AppData_Config_organizr:/config
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
