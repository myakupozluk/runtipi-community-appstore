services:
  apprise-api:
    image: linuxserver/apprise-api:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - APPRISE_ATTACH_SIZE=0
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/attachments:/attachments
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
