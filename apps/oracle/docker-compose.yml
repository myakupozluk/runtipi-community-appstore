name: oracle
services:
  oracle:
    image: gvenzl/oracle-free:23
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: app
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/oracle_oradata:/opt/oracle/oradata
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 1521
volumes:
  oradata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
