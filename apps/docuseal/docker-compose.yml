services:
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST=
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
