services:
  snibox:
    image: snowmean/snibox-sqlite:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/app_db_database:/app/db/database
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
