services:
  libredb-studio:
    image: ghcr.io/libredb/libredb-studio:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - AUTH_COOKIE_SECURE=false
    - STORAGE_PROVIDER=sqlite
    - STORAGE_SQLITE_PATH=/app/data/libredb-storage.db
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
