services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - TZ=UTC
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 7745
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
