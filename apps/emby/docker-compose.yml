services:
  emby:
    image: linuxserver/emby:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data_tvshows:/data/tvshows
    - ${APP_DATA_DIR}/data_movies:/data/movies
    - ${APP_DATA_DIR}/opt_vc_lib:/opt/vc/lib
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8096
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
