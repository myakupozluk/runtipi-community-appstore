services:
  manyfold:
    image: linuxserver/manyfold:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DATABASE_URL=
    - REDIS_URL=
    - SECRET_KEY_BASE=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/libraries:/libraries
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3214
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
