services:
  ghost-container:
    image: ghost:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/var_lib_ghost_content:/var/lib/ghost/content
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 2368
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
