services:
  davinci-postgres-server:
    image: postgres:13
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - POSTGRES_DB=database
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=DaVinci
    - TZ=America/New_York
    volumes:
    - ${APP_DATA_DIR}/var_lib_postgresql_data:/var/lib/postgresql/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5432
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
