services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - GENERIC_TIMEZONE=America/Los_Angeles
    - TZ=America/Los_Angeles
    volumes:
    - ${APP_DATA_DIR}/home_node_.n8n:/home/node/.n8n
    - ${APP_DATA_DIR}/etc_localtime:/etc/localtime
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5678
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
