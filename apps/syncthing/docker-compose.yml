services:
  syncthing:
    image: linuxserver/syncthing:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data1:/data1
    - ${APP_DATA_DIR}/data2:/data2
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8384
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
