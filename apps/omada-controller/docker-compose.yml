services:
  omada-controller:
    image: mbentley/omada-controller:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8088
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
