services:
  netbox:
    image: linuxserver/netbox:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SUPERUSER_EMAIL=
    - SUPERUSER_PASSWORD=
    - ALLOWED_HOST=
    - DB_NAME=
    - DB_USER=
    - DB_PASSWORD=
    - DB_HOST=
    - DB_PORT=
    - REDIS_HOST=
    - REDIS_PORT=
    - REDIS_USERNAME=
    - REDIS_PASSWORD=
    - REDIS_DB_TASK=
    - REDIS_DB_CACHE=
    - BASE_PATH=
    - CSRF_TRUSTED_ORIGINS=
    - REMOTE_AUTH_ENABLED=
    - REMOTE_AUTH_BACKEND=
    - REMOTE_AUTH_HEADER=
    - REMOTE_AUTH_AUTO_CREATE_USER=
    - REMOTE_AUTH_DEFAULT_GROUPS=
    - REMOTE_AUTH_DEFAULT_PERMISSIONS=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
