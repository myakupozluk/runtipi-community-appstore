services:
  contentbox:
    image: ortussolutions/contentbox:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - express=true
    - install=true
    - CFENGINE=lucee@4.5
    volumes:
    - ${APP_DATA_DIR}/data_contentbox_db:/data/contentbox/db
    - ${APP_DATA_DIR}/app_includes_shared_media:/app/includes/shared/media
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
