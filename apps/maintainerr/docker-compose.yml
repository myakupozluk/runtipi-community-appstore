services:
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - TZ=UTC
    volumes:
    - ${APP_DATA_DIR}/opt_data:/opt/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6246
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
