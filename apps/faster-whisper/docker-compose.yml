services:
  faster-whisper:
    image: linuxserver/faster-whisper:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DEBUG=
    - LOCAL_ONLY=
    - WHISPER_BEAM=1
    - WHISPER_LANG=auto
    - WHISPER_MODEL=auto
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 10300
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
