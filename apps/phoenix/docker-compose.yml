name: phoenix
services:
  phoenix:
    image: arizephoenix/phoenix:version-17
    restart: unless-stopped
    environment:
      PHOENIX_PORT: '5000'
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: 'True'
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_TELEMETRY_ENABLED: 'false'
    volumes:
    - ${APP_DATA_DIR}/phoenix_phoenixdata:/mnt/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  phoenixdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
