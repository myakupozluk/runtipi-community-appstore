services:
  adguardhome:
    image: adguard/adguardhome
    volumes:
    - ${APP_DATA_DIR}/adguardhome_portainer_Files_AppData_Config_adguardhome_workdir:/opt/adguardhome/work
    - ${APP_DATA_DIR}/adguardhome_portainer_Files_AppData_Config_adguardhome_confdir:/opt/adguardhome/conf
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 53
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
