services:
  backend:
    build:
      context: ./backend
    ports:
    - 8000:8000
    environment:
    - AIS_API_KEY=${AIS_API_KEY}
    - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID}
    - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET}
    - LTA_ACCOUNT_KEY=${LTA_ACCOUNT_KEY}
    volumes:
    - ${APP_DATA_DIR}/backend_portainer_Files_AppData_Config_shadowbroker:/app/data
    restart: unless-stopped
    networks:
    - tipi_main_network
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
    - backend
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
