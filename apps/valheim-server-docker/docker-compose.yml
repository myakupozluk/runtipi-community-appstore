services:
  valheim:
    image: ghcr.io/lloesche/valheim-server:latest
    cap_add:
    - sys_nice
    environment:
      SERVER_NAME: ${SERVER_NAME:-My Server}
      WORLD_NAME: ${WORLD_NAME:-Dedicated}
      SERVER_PASS: ${SERVER_PASS:-changeme123}
      SERVER_PUBLIC: 'false'
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${APP_DATA_DIR}/valheim_valheim-config:/config
    - ${APP_DATA_DIR}/valheim_valheim-data:/opt/valheim
    restart: unless-stopped
    stop_grace_period: 2m
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 2456
volumes:
  valheim-config: null
  valheim-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
