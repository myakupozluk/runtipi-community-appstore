services:
  stump:
    image: aaronleopold/stump:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - STUMP_CONFIG_DIR=/config
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 10801
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
