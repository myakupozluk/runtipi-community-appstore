services:
  twitch-points-miner:
    image: rdavidoff/twitch-channel-points-miner-v2:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/usr_src_app_run.py:/usr/src/app/run.py
    - ${APP_DATA_DIR}/usr_src_app_cookies:/usr/src/app/cookies
    - ${APP_DATA_DIR}/usr_src_app_logs:/usr/src/app/logs
    - ${APP_DATA_DIR}/usr_src_app_analytics:/usr/src/app/analytics
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
