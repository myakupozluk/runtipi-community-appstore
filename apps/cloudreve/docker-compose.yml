services:
  cloudreve:
    image: cloudreve/cloudreve:v4
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/cloudreve_data:/cloudreve/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5212
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
