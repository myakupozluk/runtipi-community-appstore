services:
  nocodb:
    depends_on:
      root_db:
        condition: service_healthy
    environment:
      NC_DB: mysql2://root_db:3306?u=noco&p=password&d=root_db
    image: nocodb/nocodb:latest
    restart: always
    volumes:
    - ${APP_DATA_DIR}/nocodb_portainer_Files_AppData_Config_nocodb_nc_data:/usr/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  root_db:
    environment:
      MYSQL_DATABASE: root_db
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: noco
    healthcheck:
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      timeout: 20s
    image: mysql:5.7
    restart: always
    volumes:
    - ${APP_DATA_DIR}/root_db_portainer_Files_AppData_Config_nocodb_db_data:/var/lib/mysql
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
