services:
  tooljet-plugins:
    build:
      context: ./
      dockerfile: ./docker/plugins.Dockerfile.dev
    image: tooljet-plugins:development
    platform: linux/x86_64
    volumes:
    - ${APP_DATA_DIR}/tooljet-plugins_portainer_Files_AppData_Config_tooljet_plugins:/app/plugins
    command: npm run --prefix plugins start
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  tooljet-client:
    build:
      context: ./
      dockerfile: ./docker/client.Dockerfile.dev
    image: tooljet-client:development
    platform: linux/x86_64
    volumes:
    - ${APP_DATA_DIR}/tooljet-client_portainer_Files_AppData_Config_tooljet:/app/frontend
    - ${APP_DATA_DIR}/tooljet-client_portainer_Files_AppData_Config_tooljet_plugins:/app/plugins
    - /portainer/Files/AppData/Config/tooljet/app/frontend/node_modules/
    ports:
    - 8082:8082
    environment:
    - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
    - NODE_ENV=development
    - SERVE_CLIENT=false
    command: npm run --prefix frontend start
    restart: unless-stopped
    networks:
    - tipi_main_network
  tooljet-server:
    build:
      context: ./
      dockerfile: ./docker/server.Dockerfile.dev
    image: tooljet-server:development
    platform: linux/x86_64
    depends_on:
    - tooljet-postgres
    volumes:
    - ${APP_DATA_DIR}/tooljet-server_portainer_Files_AppData_Config_tooljet_server:/app/server
    - ${APP_DATA_DIR}/tooljet-server_portainer_Files_AppData_Config_tooljet_server_plugins:/app/plugins
    - /portainer/Files/AppData/Config/tooljet/server/app/server/node_modules/
    - ${APP_DATA_DIR}/tooljet-server_portainer_Files_AppData_Config_tooljet_server_.env:/app/.env
    - ${APP_DATA_DIR}/tooljet-server_portainer_Files_AppData_Config_tooljet_server_.env.test:/app/.env.test
    ports:
    - 3000:3000
    environment:
    - SERVE_CLIENT=false
    - FORCE_COLOR=1
    command: npm run --prefix server start:dev
    restart: unless-stopped
    networks:
    - tipi_main_network
  tooljet-postgrest:
    image: postgrest/postgrest:v10.1.1.20221215
    ports:
    - 7001:3000
    env_file:
    - /portainer/Files/AppData/Config/tooljet/server/.env
    depends_on:
    - tooljet-postgres
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
  tooljet-postgres:
    image: postgres:13
    restart: always
    ports:
    - 5432:5432
    volumes:
    - ${APP_DATA_DIR}/tooljet-postgres_portainer_Files_AppData_Config_tooljet_postgres:/data/postgres
    environment:
    - POSTGRES_PASSWORD=postgres
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
