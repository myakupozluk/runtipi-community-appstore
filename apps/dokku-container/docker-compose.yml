services:
  dokku-container:
    image: dokku/dokku:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - DOKKU_HOSTNAME=
    - DOKKU_HOST_ROOT=/var/lib/dokku/home/dokku
    volumes:
    - ${APP_DATA_DIR}/mnt_dokku:/mnt/dokku
    - ${APP_DATA_DIR}/var_run_docker.sock:/var/run/docker.sock
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 22
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
