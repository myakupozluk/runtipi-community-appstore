services:
  alpine-xfce4-novnc:
    image: novaspirit/alpine_xfce4_novnc:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/home_alpine_downloads:/home/alpine/downloads
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
