services:
  urlwatch:
    image: mediadepot/urlwatch:master
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/srv_urlwatch_config:/srv/urlwatch/config
    - ${APP_DATA_DIR}/etc_localtime:/etc/localtime
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8081
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
