services:
  postgresql:
    image: postgres:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - POSTGRES_USER=
    - POSTGRES_PASSWORD=
    volumes:
    - ${APP_DATA_DIR}/var_lib_postgresql_data:/var/lib/postgresql/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5432
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
