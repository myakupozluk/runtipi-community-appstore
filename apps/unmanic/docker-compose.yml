services:
  unmanic:
    image: josh5/unmanic:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/library:/library
    - ${APP_DATA_DIR}/tmp_unmanic:/tmp/unmanic
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8888
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
