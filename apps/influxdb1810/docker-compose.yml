services:
  influxdb1810:
    image: influxdb:1.8.10
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/var_lib_influxdb:/var/lib/influxdb
    - ${APP_DATA_DIR}/etc_influxdb:/etc/influxdb
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8086
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
