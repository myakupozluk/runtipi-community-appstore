services:
  mautic-container:
    image: mautic/mautic:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - MAUTIC_DB_HOST=
    - MAUTIC_DB_PASSWORD=
    volumes:
    - ${APP_DATA_DIR}/var_www_html:/var/www/html
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
