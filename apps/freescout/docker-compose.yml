services:
  freescout-db:
    image: mariadb
    hostname: freescout-db
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -P 3306 -prootpass | grep 'mysqld is alive' || exit 1
    volumes:
    - ${APP_DATA_DIR}/freescout-db_portainer_Files_AppData_Config_freescout_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: freescoutuser
      MYSQL_PASSWORD: freescoutpass
      MYSQL_DATABASE: freescout
    restart: on-failure:5
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  freescout:
    image: tiredofit/freescout:latest
    hostname: freescout
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    ports:
    - 5135:80
    volumes:
    - ${APP_DATA_DIR}/freescout_portainer_Files_AppData_Config_freescout_data:/data
    - ${APP_DATA_DIR}/freescout_portainer_Files_AppData_Config_freescout_logs:/www/logs
    environment:
      ADMIN_EMAIL: yourownemail
      ADMIN_PASS: mariushosting
      SITE_URL: https://freescout.yourdomain.com
      ENABLE_SSL_PROXY: true
      DB_HOST: freescout-db
      DB_NAME: freescout
      DB_USER: freescoutuser
      DB_PASS: freescoutpass
    restart: on-failure:5
    depends_on:
      freescout-db:
        condition: service_healthy
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
