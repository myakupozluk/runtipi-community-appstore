services:
  databag:
    image: balzack/databag:0.1.18
    restart: unless-stopped
    environment:
    - ADMIN=${DATABAG_ADMIN_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/databag_databag-data:/var/lib/databag
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 7000
volumes:
  databag-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
