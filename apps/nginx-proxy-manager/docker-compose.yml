services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - DB_SQLITE_FILE=/data/database.sqlite
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/etc_letsencrypt:/etc/letsencrypt
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
