name: tei
services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    environment:
      PORT: '5000'
      MODEL_ID: ${MODEL_ID:-BAAI/bge-small-en-v1.5}
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
    - ${APP_DATA_DIR}/tei_modelcache:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  modelcache: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
