name: percona-server
services:
  percona:
    image: percona/percona-server:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/percona_perconadata:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
volumes:
  perconadata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
