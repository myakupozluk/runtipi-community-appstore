x-logging:
  logging: &id001
    driver: json-file
    options:
      max-file: '5'
      max-size: 10m
services:
  traefik:
    logging: *id001
    image: traefik:2.7
    command:
    - --providers.file.directory=/storage/config
    - --providers.file.watch=true
    - --providers.docker=true
    - --providers.docker.exposedByDefault=false
    - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite`)
    - --entrypoints.appwrite_web.address=:80
    - --entrypoints.appwrite_websecure.address=:443
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ${APP_DATA_DIR}/traefik_var_run_docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_appwrite_config:/storage/config
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_appwrite_certificates:/storage/certificates
    depends_on:
    - appwrite
    networks:
    - gateway
    - appwrite
    - tipi_main_network
  appwrite:
    logging: *id001
    image: appwrite/appwrite:1.1.1
    restart: unless-stopped
    networks:
    - appwrite
    - tipi_main_network
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite
    - traefik.docker.network=appwrite
    - traefik.http.services.appwrite_api.loadbalancer.server.port=80
    - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_http.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_api_https.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_https.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.tls=true
    volumes:
    - ${APP_DATA_DIR}/appwrite_portainer_Files_AppData_Config_appwrite_uploads:/storage/uploads
    - ${APP_DATA_DIR}/appwrite_portainer_Files_AppData_Config_appwrite_appwrite_cache:/storage/cache
    - ${APP_DATA_DIR}/appwrite_portainer_Files_AppData_Config_appwrite_config:/storage/config
    - ${APP_DATA_DIR}/appwrite_portainer_Files_AppData_Config_appwrite_certificates:/storage/certificates
    - ${APP_DATA_DIR}/appwrite_portainer_Files_AppData_Config_appwrite_functions:/storage/functions
    depends_on:
    - mariadb
    - redis
    - influxdb
    environment:
    - _APP_ENV=production
    - _APP_WORKER_PER_CORE=6
    - _APP_LOCALE=en
    - _APP_CONSOLE_WHITELIST_ROOT=enabled
    - _APP_CONSOLE_WHITELIST_EMAILS=
    - _APP_CONSOLE_WHITELIST_IPS=
    - _APP_SYSTEM_EMAIL_NAME=Appwrite
    - _APP_SYSTEM_EMAIL_ADDRESS=team@appwrite.io
    - _APP_SYSTEM_SECURITY_EMAIL_ADDRESS=certs@appwrite.io
    - _APP_SYSTEM_RESPONSE_FORMAT=
    - _APP_OPTIONS_ABUSE=enabled
    - _APP_OPTIONS_FORCE_HTTPS=disabled
    - _APP_OPENSSL_KEY_V1=just-a-key
    - _APP_DOMAIN=localhost
    - _APP_DOMAIN_TARGET=localhost
    - _APP_REDIS_HOST=redis
    - _APP_REDIS_PORT=6379
    - _APP_REDIS_USER=
    - _APP_REDIS_PASS=
    - _APP_DB_HOST=mariadb
    - _APP_DB_PORT=3306
    - _APP_DB_SCHEMA=appwrite
    - _APP_DB_USER=user
    - _APP_DB_PASS=password
    - _APP_DB_ROOT_PASS=rootsecretpassword
