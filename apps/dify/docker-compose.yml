name: dify
x-api-env:
  SECRET_KEY: ${SECRET_KEY}
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: db
  DB_PORT: '5432'
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_AUTH}
  CELERY_BROKER_URL: redis://:${REDIS_AUTH}@redis:6379/1
  VECTOR_STORE: qdrant
  QDRANT_URL: http://vectordb:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: /app/api/storage
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
  SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
  PLUGIN_DAEMON_URL: http://plugin-daemon:5002
  PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
  PLUGIN_DIFY_INNER_API_URL: http://api:5001
  PLUGIN_DIFY_INNER_API_KEY: ${INNER_API_KEY}
  INNER_API_KEY_FOR_PLUGIN: ${INNER_API_KEY}
  MIGRATION_ENABLED: 'true'
services:
  api:
    image: langgenius/dify-api:1.14.2
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_AUTH}
      CELERY_BROKER_URL: redis://:${REDIS_AUTH}@redis:6379/1
      VECTOR_STORE: qdrant
      QDRANT_URL: http://vectordb:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
      SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      PLUGIN_DIFY_INNER_API_URL: http://api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${INNER_API_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${INNER_API_KEY}
      MIGRATION_ENABLED: 'true'
      MODE: api
    volumes:
    - ${APP_DATA_DIR}/api_appstorage:/app/api/storage
    depends_on:
    - db
    - redis
    - vectordb
    networks:
    - tipi_main_network
  worker:
    image: langgenius/dify-api:1.14.2
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_AUTH}
      CELERY_BROKER_URL: redis://:${REDIS_AUTH}@redis:6379/1
      VECTOR_STORE: qdrant
      QDRANT_URL: http://vectordb:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
      SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      PLUGIN_DIFY_INNER_API_URL: http://api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${INNER_API_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${INNER_API_KEY}
      MIGRATION_ENABLED: 'true'
      MODE: worker
    volumes:
    - ${APP_DATA_DIR}/worker_appstorage:/app/api/storage
    depends_on:
    - db
    - redis
    - vectordb
    networks:
    - tipi_main_network
  worker_beat:
    image: langgenius/dify-api:1.14.2
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_AUTH}
      CELERY_BROKER_URL: redis://:${REDIS_AUTH}@redis:6379/1
      VECTOR_STORE: qdrant
      QDRANT_URL: http://vectordb:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
      SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      PLUGIN_DIFY_INNER_API_URL: http://api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${INNER_API_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${INNER_API_KEY}
      MIGRATION_ENABLED: 'true'
      MODE: beat
    depends_on:
    - db
    - redis
    networks:
    - tipi_main_network
    volumes: []
  web:
    image: langgenius/dify-web:1.14.2
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ''
      APP_API_URL: ''
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 8080
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.4.1-local
    restart: unless-stopped
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_AUTH}
      SERVER_PORT: '5002'
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${INNER_API_KEY}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: '5003'
      PLUGIN_REMOTE_INSTALLING_ENABLED: 'true'
    volumes:
    - ${APP_DATA_DIR}/plugin_daemon_pluginstorage:/app/storage
    depends_on:
    - db
    - redis
    networks:
    - tipi_main_network
  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: '15'
      ENABLE_NETWORK: 'true'
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
    networks:
    - tipi_main_network
    volumes: []
  ssrf_proxy:
    build: ./ssrf-proxy
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
  entry:
    build: ./entry
    restart: unless-stopped
    ports:
    - 5000:5000
    depends_on:
    - api
    - web
    networks:
    - tipi_main_network
    volumes: []
  redis:
    build: ./redis
    restart: unless-stopped
    environment:
      REDIS_AUTH: ${REDIS_AUTH}
    networks:
    - tipi_main_network
    volumes: []
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
  vectordb:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
    - ${APP_DATA_DIR}/vectordb_qdrantdata:/qdrant/storage
    networks:
    - tipi_main_network
volumes:
  appstorage: null
  pluginstorage: null
  dbdata: null
  qdrantdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
