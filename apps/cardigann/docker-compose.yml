services:
  cardigann:
    image: linuxserver/cardigann:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PGID=15000
    - PUID=15000
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5060
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
