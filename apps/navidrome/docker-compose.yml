services:
  navidrome:
    image: deluan/navidrome:latest
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ''
    volumes:
    - ${APP_DATA_DIR}/navidrome_portainer_Files_AppData_Config_navidrome:/data
    - ${APP_DATA_DIR}/navidrome_path_to_your_music_folder:/music
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4533
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
