name: forgejo-runner
services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      FORGEJO_URL: ${FORGEJO_URL:-https://codeberg.org}
      RUNNER_UUID: ${RUNNER_UUID}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_LABELS: ${RUNNER_LABELS:-miget:host}
      RUNNER_CAPACITY: ${RUNNER_CAPACITY:-1}
    volumes:
    - ${APP_DATA_DIR}/runner_runnerdata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
volumes:
  runnerdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
