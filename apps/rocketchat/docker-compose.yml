name: rocketchat
services:
  rocketchat:
    image: rocketchat/rocket.chat:8.4.3
    restart: unless-stopped
    environment:
      PORT: '5000'
      ROOT_URL: ${ROOT_URL:-http://localhost:5000}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/rocketchat?replicaSet=rs0}
    depends_on:
    - mongo
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  mongo:
    image: mongo:8
    restart: unless-stopped
    command:
    - sh
    - -c
    - "( until mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do\
      \ sleep 2; done\n  mongosh --quiet --eval 'try { rs.status().ok } catch (e)\
      \ { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}) }'\n)\
      \ &\nexec mongod --replSet rs0 --bind_ip_all\n"
    ports:
    - 27017:27017
    volumes:
    - ${APP_DATA_DIR}/mongo_mongodata:/data/db
    networks:
    - tipi_main_network
volumes:
  mongodata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
