networks:
  app-global:
    external: true
  mysql-internal: null
  tipi_main_network:
    external: true
services:
  openbudgeteer:
    image: axelander/openbudgeteer
    environment:
    - Connection:Server=openbudgeteer-mysql
    - Connection:Port=3306
    - Connection:Database=openbudgeteer
    - Connection:User=openbudgeteer
    - Connection:Password=openbudgeteer
    - AppSettings:Culture=en-US
    depends_on:
    - mysql
    networks:
    - app-global
    - mysql-internal
    - tipi_main_network
    restart: unless-stopped
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 80
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: myRootPassword
    volumes:
    - ${APP_DATA_DIR}/mysql_portainer_Files_AppData_Config_openbudgeteer_data:/var/lib/mysql
    networks:
    - mysql-internal
    - tipi_main_network
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    links:
    - mysql:db
    ports:
    - 8080:80
    networks:
    - app-global
    - mysql-internal
    - tipi_main_network
    restart: unless-stopped
    volumes: []
volumes:
  data: null
x-runtipi:
  schema_version: 2
