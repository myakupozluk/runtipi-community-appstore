name: redis
services:
  redis:
    build: .
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/redis_redisdata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6379
volumes:
  redisdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
