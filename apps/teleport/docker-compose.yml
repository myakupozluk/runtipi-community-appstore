services:
  one:
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/one.yaml
    mem_limit: 300m
    memswap_limit: 0
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    volumes:
    - ${APP_DATA_DIR}/one_portainer_Files_AppData_teleport_one_data_one:/var/lib/teleport
    - ${APP_DATA_DIR}/one_portainer_Files_AppData_Config_teleport_one:/root/go/src/github.com/gravitational/teleport
    - ${APP_DATA_DIR}/one_certs:/mnt/shared/certs
    networks:
      teleport:
        ipv4_address: 172.10.1.1
        aliases:
        - one-lb
      tipi_main_network: {}
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 3080
  one-node:
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/one-node.yaml
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    mem_limit: 300m
    volumes:
    - ${APP_DATA_DIR}/one-node_portainer_Files_AppData_teleport_one-node_data_one-node:/var/lib/teleport
    - ${APP_DATA_DIR}/one-node_portainer_Files_AppData_Config_teleport_one-node:/root/go/src/github.com/gravitational/teleport
    networks:
      teleport:
        ipv4_address: 172.10.1.20
      tipi_main_network: {}
    restart: unless-stopped
  one-sshd:
    image: teleport:latest
    command: /usr/bin/start-sshd.sh
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    mem_limit: 300m
    volumes:
    - ${APP_DATA_DIR}/one-sshd_portainer_Files_AppData_teleport_one-sshd_pam.d_ssh:/etc/pam.d/ssh
    - ${APP_DATA_DIR}/one-sshd_portainer_Files_AppData_Config_teleport_one-sshd:/etc/ssh/sshd_config
    - ${APP_DATA_DIR}/one-sshd_certs:/mnt/shared/certs
    networks:
      teleport:
        ipv4_address: 172.10.1.21
      tipi_main_network: {}
    restart: unless-stopped
  one-proxy:
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/one-proxy.yaml
    mem_limit: 300m
    ports:
    - 4080:3080
    - 4023:3023
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    volumes:
    - ${APP_DATA_DIR}/one-proxy_portainer_Files_AppData_teleport_one-proxy:/var/lib/teleport
    - ${APP_DATA_DIR}/one-proxy_portainer_Files_AppData_Config_teleport_one-proxy:/root/go/src/github.com/gravitational/teleport
    networks:
      teleport:
        ipv4_address: 172.10.1.10
        aliases:
        - one-lb
      tipi_main_network: {}
    restart: unless-stopped
  two-auth:
    mem_limit: 300m
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/two-auth.yaml
      --insecure
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    volumes:
    - ${APP_DATA_DIR}/two-auth_portainer_Files_AppData_teleport_two_auth:/var/lib/teleport
    - ${APP_DATA_DIR}/two-auth_portainer_Files_AppData_Config_teleport_two:/root/go/src/github.com/gravitational/teleport
    networks:
      teleport:
        ipv4_address: 172.10.1.2
      tipi_main_network: {}
    restart: unless-stopped
  two-proxy:
    mem_limit: 300m
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/two-proxy.yaml
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    ports:
    - 5080:5080
    - 5023:5023
    volumes:
    - ${APP_DATA_DIR}/two-proxy_portainer_Files_AppData_teleport_two-proxy_data:/var/lib/teleport
    - ${APP_DATA_DIR}/two-proxy_portainer_Files_AppData_Config_teleport_two-proxy:/root/go/src/github.com/gravitational/teleport
    networks:
      teleport:
        ipv4_address: 172.10.1.3
      tipi_main_network: {}
    restart: unless-stopped
  two-node:
    mem_limit: 300m
    image: teleport:latest
    command: ${CONTAINERHOME}/build/teleport start -d -c ${CONTAINERHOME}/docker/two-node.yaml
    environment:
      DEBUG: 1
      CONTAINERHOME: /root/go/src/github.com/gravitational/teleport
    volumes:
    - ${APP_DATA_DIR}/two-node_portainer_Files_AppData_teleport_two-node_data:/var/lib/teleport
    - ${APP_DATA_DIR}/two-node_portainer_Files_AppData_Config_teleport_two-node:/root/go/src/github.com/gravitational/teleport
    networks:
      teleport:
        ipv4_address: 172.10.1.4
      tipi_main_network: {}
    restart: unless-stopped
networks:
  teleport:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 172.10.1.0/16
        ip_range: 172.10.1.0/24
        gateway: 172.10.1.254
  tipi_main_network:
    external: true
volumes:
  certs: null
x-runtipi:
  schema_version: 2
