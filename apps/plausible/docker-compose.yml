name: plausible
services:
  plausible:
    build: .
    restart: unless-stopped
    environment:
      HTTP_PORT: '5000'
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgres://plausible:plausible-local-only@db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db
    depends_on:
    - db
    - clickhouse
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  clickhouse:
    build: ./clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
    - ${APP_DATA_DIR}/clickhouse_chdata:/var/lib/clickhouse
    networks:
    - tipi_main_network
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: plausible-local-only
      POSTGRES_DB: plausible_db
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  chdata: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
