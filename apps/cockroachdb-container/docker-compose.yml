services:
  cockroachdb-container:
    image: cockroachdb/cockroach:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/cockroach_cockroach-data:/cockroach/cockroach-data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 26257
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
