services:
  nextcloud:
    image: owncloud/server:latest
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN}
    - OWNCLOUD_DB_TYPE=mysql
    - OWNCLOUD_DB_NAME=owncloud
    - OWNCLOUD_DB_USERNAME=owncloud
    - OWNCLOUD_DB_PASSWORD=${DB_PASSWORD}
    - OWNCLOUD_DB_HOST=owncloudmariadb
    - OWNCLOUD_ADMIN_USERNAME=${ADMIN_USERNAME}
    - OWNCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    - OWNCLOUD_MYSQL_UTF8MB4=true
    - OWNCLOUD_REDIS_ENABLED=true
    - OWNCLOUD_REDIS_HOST=owncloudredis
    volumes:
    - ${APP_DATA_DIR}/nextcloud_portainer_Files_AppData_Config_Owncloud_data:/mnt/data
    ports:
    - ${PORT}:8080
    restart: unless-stopped
    depends_on:
    - owncloudmariadb
    - owncloudredis
    networks:
    - tipi_main_network
  owncloudmariadb:
    image: mariadb:10.5
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    - MYSQL_USER=owncloud
    - MYSQL_PASSWORD=${DB_PASSWORD}
    - MYSQL_DATABASE=owncloud
    volumes:
    - ${APP_DATA_DIR}/owncloudmariadb_portainer_Files_AppData_Config_Owncloud_DB:/var/lib/mysql
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  owncloudredis:
    image: redis:6
    volumes:
    - ${APP_DATA_DIR}/owncloudredis_portainer_Files_AppData_Config_Owncloud_redis:/data
    restart: unless-stopped
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
