services:
  calibre-web:
    image: linuxserver/calibre-web:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DOCKER_MODS=linuxserver/mods:universal-calibre
    - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/books:/books
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8083
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
