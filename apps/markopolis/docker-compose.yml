services:
  markopolis:
    image: ghcr.io/rishikanthc/markopolis:2.0.0
    environment:
    - MARKOPOLIS_DOMAIN=""
    - MARKOPOLIS_FRONTEND_URL = ""
    - MARKOPOLIS_TITLE="Awesome Notes"
    - MARKOPOLIS_MD_PATH=/app/markdown
    - MARKOPOLIS_API_KEY=<really long random alpha-numeric string>
    volumes:
    - ${APP_DATA_DIR}/markopolis_portainer_Files_AppData_Config_markopolis:/app/markdown
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
volumes:
  markopolis_data:
    driver: local
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
