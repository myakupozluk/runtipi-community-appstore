services:
  ubooquity:
    image: linuxserver/ubooquity:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - MAXMEM=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/books:/books
    - ${APP_DATA_DIR}/comics:/comics
    - ${APP_DATA_DIR}/files:/files
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 2202
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
