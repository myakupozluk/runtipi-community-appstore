services:
  filepizza:
    image: kern/filepizza:latest
    restart: always
    build:
      context: .
    environment:
    - PORT=3333
    - EXTRA_ICE_SERVERS=turn:localhost:3478
    - WEBTORRENT_TRACKERS=ws://localhost:28000
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 3333
  coturn:
    image: instrumentisto/coturn:latest
    network_mode: host
    ports:
    - 3478:3478
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
  bittorrent-tracker:
    image: henkel/bittorrent-tracker:latest
    command:
    - npx
    - bittorrent-tracker
    - --http-hostname
    - 0.0.0.0
    - --ws
    ports:
    - 28000:8000
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
