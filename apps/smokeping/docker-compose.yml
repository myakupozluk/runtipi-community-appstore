services:
  smokeping:
    image: linuxserver/smokeping:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - MASTER_URL=http://<master-host-ip>:80/smokeping/
    - SHARED_SECRET=password
    - CACHE_DIR=/tmp
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
