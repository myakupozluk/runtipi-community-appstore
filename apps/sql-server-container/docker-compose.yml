services:
  sql-server-container:
    image: microsoft/mssql-server-windows-developer:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - ACCEPT_EULA=Y
    - sa_password=
    volumes:
    - ${APP_DATA_DIR}/C:_temp:C:/temp/
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 1433
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
