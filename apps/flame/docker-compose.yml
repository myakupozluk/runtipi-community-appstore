services:
  flame:
    image: pawelmalak/flame:multiarch
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PASSWORD=
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    - ${APP_DATA_DIR}/var_run_docker.sock:/var/run/docker.sock
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5005
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
