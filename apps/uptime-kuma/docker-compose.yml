services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3001
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
