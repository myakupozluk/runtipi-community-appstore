services:
  rabbitmq-container:
    image: rabbitmq:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/var_lib_rabbitmq:/var/lib/rabbitmq
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5671
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
