services:
  ironfunctions-ui:
    image: iron/functions-ui:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - API_URL=
    volumes:
    - ${APP_DATA_DIR}/app_data:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
