services:
  technitium-dns:
    image: technitium/dns-server:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - DNS_SERVER_DOMAIN=dns-server
    - DNS_SERVER_ADMIN_PASSWORD=
    volumes:
    - ${APP_DATA_DIR}/etc_dns:/etc/dns
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5380
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
