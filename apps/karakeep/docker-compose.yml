name: karakeep
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.32.0
    restart: unless-stopped
    environment:
      PORT: '5000'
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:5000}
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      BROWSER_WEB_URL: http://chrome:9222
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
    - meilisearch
    - chrome
    volumes:
    - ${APP_DATA_DIR}/karakeep_data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
    - ${APP_DATA_DIR}/meilisearch_meili:/meili_data
    networks:
    - tipi_main_network
  chrome:
    build: ./chrome
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
volumes:
  data: null
  meili: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
