services:
  readeck:
    image: codeberg.org/readeck/readeck:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/readeck:/readeck
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
