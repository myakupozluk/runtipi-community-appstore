services:
  elasticsearch:
    image: elasticsearch:9.5.3
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - discovery.type=single-node
    - xpack.security.enabled=false
    volumes:
    - ${APP_DATA_DIR}/usr_share_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 9200
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
