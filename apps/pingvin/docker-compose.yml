services:
  pingvin-share:
    image: stonith404/pingvin-share
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/pingvin-share_portainer_Files_AppData_Config_pingvin:/opt/app/backend/data
    - ${APP_DATA_DIR}/pingvin-share_portainer_Files_AppData_Config_pingvin_images:/opt/app/frontend/public/img
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
