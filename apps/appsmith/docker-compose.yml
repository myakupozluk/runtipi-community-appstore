services:
  appsmith:
    image: index.docker.io/appsmith/appsmith-ce
    volumes:
    - ${APP_DATA_DIR}/appsmith_portainer_Files_AppData_Config_appsmith:/appsmith-stacks
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
