services:
  registry-cache:
    image: registry:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
    volumes:
    - ${APP_DATA_DIR}/var_lib_registry:/var/lib/registry
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
