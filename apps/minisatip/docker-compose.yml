services:
  minisatip:
    image: linuxserver/minisatip:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - RUN_OPTS=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8875
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
