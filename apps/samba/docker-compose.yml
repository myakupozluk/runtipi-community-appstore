services:
  samba:
    image: dperson/samba:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - USERID=1000
    - GROUPID=1000
    - USER=guest;guest
    - PERMISSIONS=true
    - SHARE=portainer;/share;yes;no;yes;guest
    volumes:
    - ${APP_DATA_DIR}/share:/share
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 139
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
