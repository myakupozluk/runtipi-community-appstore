name: typesense
services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_PORT: '5000'
      TYPESENSE_ENABLE_CORS: 'true'
    volumes:
    - ${APP_DATA_DIR}/typesense_typesensedata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
volumes:
  typesensedata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
