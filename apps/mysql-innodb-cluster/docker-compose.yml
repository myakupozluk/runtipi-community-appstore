name: mysql-innodb-cluster
x-gr:
  image: mysql:8.4
  restart: unless-stopped
  environment: &id001
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  command: &id002
  - --server-id=1
  - --log-bin
  - --gtid-mode=ON
  - --enforce-gtid-consistency=ON
  - --log-replica-updates=ON
  - --binlog-checksum=NONE
  - --plugin-load-add=group_replication.so
  - --loose-group-replication-group-name=a1a2a3a4-b1b2-c1c2-d1d2-e1e2e3e4e5e6
  - --loose-group-replication-start-on-boot=OFF
  - --loose-group-replication-ip-allowlist=AUTOMATIC
  - --loose-group-replication-group-seeds=mysql-gr-1:33061,mysql-gr-2:33061,mysql-gr-3:33061
  - --loose-group-replication-local-address=mysql-gr-1:33061
services:
  mysql-gr-1:
    image: mysql:8.4
    restart: unless-stopped
    environment: *id001
    command: *id002
    volumes:
    - ${APP_DATA_DIR}/mysql-gr-1_gr1-data:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
  mysql-gr-2:
    image: mysql:8.4
    restart: unless-stopped
    environment: *id001
    command:
    - --server-id=2
    - --log-bin
    - --gtid-mode=ON
    - --enforce-gtid-consistency=ON
    - --log-replica-updates=ON
    - --binlog-checksum=NONE
    - --plugin-load-add=group_replication.so
    - --loose-group-replication-group-name=a1a2a3a4-b1b2-c1c2-d1d2-e1e2e3e4e5e6
    - --loose-group-replication-start-on-boot=OFF
    - --loose-group-replication-ip-allowlist=AUTOMATIC
    - --loose-group-replication-group-seeds=mysql-gr-1:33061,mysql-gr-2:33061,mysql-gr-3:33061
    - --loose-group-replication-local-address=mysql-gr-2:33061
    volumes:
    - ${APP_DATA_DIR}/mysql-gr-2_gr2-data:/var/lib/mysql
    networks:
    - tipi_main_network
  mysql-gr-3:
    image: mysql:8.4
    restart: unless-stopped
    environment: *id001
    command:
    - --server-id=3
    - --log-bin
    - --gtid-mode=ON
    - --enforce-gtid-consistency=ON
    - --log-replica-updates=ON
    - --binlog-checksum=NONE
    - --plugin-load-add=group_replication.so
    - --loose-group-replication-group-name=a1a2a3a4-b1b2-c1c2-d1d2-e1e2e3e4e5e6
    - --loose-group-replication-start-on-boot=OFF
    - --loose-group-replication-ip-allowlist=AUTOMATIC
    - --loose-group-replication-group-seeds=mysql-gr-1:33061,mysql-gr-2:33061,mysql-gr-3:33061
    - --loose-group-replication-local-address=mysql-gr-3:33061
    volumes:
    - ${APP_DATA_DIR}/mysql-gr-3_gr3-data:/var/lib/mysql
    networks:
    - tipi_main_network
  mysql-init:
    build: ./init
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    depends_on:
    - mysql-gr-1
    - mysql-gr-2
    - mysql-gr-3
    networks:
    - tipi_main_network
    volumes: []
volumes:
  gr1-data: null
  gr2-data: null
  gr3-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
