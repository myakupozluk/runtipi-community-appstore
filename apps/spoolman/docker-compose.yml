services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/home_app_.local_share_spoolman:/home/app/.local/share/spoolman
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
