services:
  homebridge:
    image: homebridge/homebridge:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PGID=1000
    - PUID=1000
    - HOMEBRIDGE_CONFIG_UI=1
    - HOMEBRIDGE_CONFIG_UI_PORT=8581
    - TZ=America/New_York
    volumes:
    - ${APP_DATA_DIR}/homebridge:/homebridge
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
