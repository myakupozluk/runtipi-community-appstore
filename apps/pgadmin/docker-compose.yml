services:
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - PGADMIN_DEFAULT_EMAIL=
    - PGADMIN_DEFAULT_PASSWORD=
    - TZ=America/New_York
    volumes:
    - ${APP_DATA_DIR}/var_lib_pgadmin:/var/lib/pgadmin
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
