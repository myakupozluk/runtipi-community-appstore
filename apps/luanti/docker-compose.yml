services:
  luanti:
    image: linuxserver/luanti:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - CLI_ARGS=--gameid devtest
    volumes:
    - ${APP_DATA_DIR}/config_.minetest:/config/.minetest
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 30000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
