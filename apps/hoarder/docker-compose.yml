services:
  hoarder-web:
    image: ghcr.io/hoarder-app/hoarder-web:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/hoarder-web_portainer_Files_AppData_Config_hoarder_data:/data
    environment:
      REDIS_HOST: redis
      MEILI_ADDR: http://meilisearch:7700
      DATA_DIR: /data
      HOARDER_VERSION: latest
      NEXTAUTH_SECRET: qxo0NvLCphGhkAu5fBcS1B0MxCeoig8G
      NEXTAUTH_URL: http://localhost:3088
      MEILI_MASTER_KEY: aqxYm5UWCphGhkAu5fBcSJAPbSzeoiC2X
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000
  hoarder-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/hoarder-redis_portainer_Files_AppData_Config_hoarder_redis:/data
    networks:
    - tipi_main_network
  hoarder-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    restart: unless-stopped
    command:
    - --no-sandbox
    - --disable-gpu
    - --disable-dev-shm-usage
    - --remote-debugging-address=0.0.0.0
    - --remote-debugging-port=9222
    - --hide-scrollbars
    networks:
    - tipi_main_network
    volumes: []
  hoarder-meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      HOARDER_VERSION: latest
      NEXTAUTH_SECRET: qxo0NvLCphGhkAu5fBcS1B0MxCeoig8G
      NEXTAUTH_URL: http://localhost:3088
      MEILI_MASTER_KEY: aqxYm5UWCphGhkAu5fBcSJAPbSzeoiC2X
    volumes:
    - ${APP_DATA_DIR}/hoarder-meilisearch_portainer_Files_AppData_Config_hoarder_meilisearch:/meili_data
    networks:
    - tipi_main_network
  hoarder-workers:
    image: ghcr.io/hoarder-app/hoarder-workers:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/hoarder-workers_portainer_Files_AppData_Config_hoarder_data:/data
    environment:
      REDIS_HOST: redis
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      HOARDER_VERSION: latest
      NEXTAUTH_SECRET: qxo0NvLCphGhkAu5fBcS1B0MxCeoig8G
      NEXTAUTH_URL: http://localhost:3088
      MEILI_MASTER_KEY: aqxYm5UWCphGhkAu5fBcSJAPbSzeoiC2X
    depends_on:
      hoarder-web:
        condition: service_started
    networks:
    - tipi_main_network
volumes:
  redis: null
  meilisearch: null
  data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
