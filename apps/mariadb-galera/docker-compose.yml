name: mariadb-galera
x-galera-env: &id002
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
x-galera-common:
  restart: unless-stopped
  stop_grace_period: 2m
  healthcheck: &id001
    test:
    - CMD
    - healthcheck.sh
    - --connect
    - --galera_online
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 90s
services:
  galera-1:
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck: *id001
    build: ./bootstrap
    command:
    - mariadbd
    - --wsrep_on=ON
    - --wsrep_provider=/usr/lib/galera/libgalera_smm.so
    - --wsrep_cluster_name=galera
    - --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
    - --wsrep_node_name=galera-1
    - --binlog_format=ROW
    - --innodb_autoinc_lock_mode=2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ${MARIADB_APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/galera-1_galeradata-1:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  galera-2:
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck: *id001
    image: mariadb:11.8
    command:
    - mariadbd
    - --wsrep_on=ON
    - --wsrep_provider=/usr/lib/galera/libgalera_smm.so
    - --wsrep_cluster_name=galera
    - --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
    - --wsrep_node_name=galera-2
    - --binlog_format=ROW
    - --innodb_autoinc_lock_mode=2
    environment: *id002
    volumes:
    - ${APP_DATA_DIR}/galera-2_galeradata-2:/var/lib/mysql
    networks:
    - tipi_main_network
  galera-3:
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck: *id001
    image: mariadb:11.8
    command:
    - mariadbd
    - --wsrep_on=ON
    - --wsrep_provider=/usr/lib/galera/libgalera_smm.so
    - --wsrep_cluster_name=galera
    - --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
    - --wsrep_node_name=galera-3
    - --binlog_format=ROW
    - --innodb_autoinc_lock_mode=2
    environment: *id002
    volumes:
    - ${APP_DATA_DIR}/galera-3_galeradata-3:/var/lib/mysql
    networks:
    - tipi_main_network
volumes:
  galeradata-1: null
  galeradata-2: null
  galeradata-3: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
