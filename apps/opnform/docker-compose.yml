services:
  opnform:
    volumes:
    - ${APP_DATA_DIR}/opnform_portainer_Files_AppData_Config_opnform:/persist
    image: jhumanj/opnform
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
