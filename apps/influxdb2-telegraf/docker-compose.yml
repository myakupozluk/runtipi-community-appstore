services:
  influxdb:
    image: influxdb:latest
    volumes:
    - ${APP_DATA_DIR}/influxdb_portainer_Files_AppData_Config_influxdb2:/var/lib/influxdb2
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8086
  influxdb_cli:
    links:
    - influxdb
    image: influxdb:latest
    volumes:
    - ${APP_DATA_DIR}/influxdb_cli_portainer_Files_AppData_Config_influxdb2:/var/lib/influxdb2
    - ${APP_DATA_DIR}/influxdb_cli_portainer_Files_AppData_Config_influxdb2_ssl_influxdb-selfsigned.crt:/etc/ssl/influxdb-selfsigned.crt
    - ${APP_DATA_DIR}/influxdb_cli_portainer_Files_AppData_Config_influxdb2_ssl_influxdb-selfsigned.key:/etc/ssl/influxdb-selfsigned.key
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=myusername
    - DOCKER_INFLUXDB_INIT_PASSWORD=passwordpasswordpassword
    - DOCKER_INFLUXDB_INIT_ORG=myorg
    - DOCKER_INFLUXDB_INIT_BUCKET=mybucket
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken
    - INFLUXD_TLS_CERT=/etc/ssl/influxdb-selfsigned.crt
    - INFLUXD_TLS_KEY=/etc/ssl/influxdb-selfsigned.key
    entrypoint:
    - ./entrypoint.sh
    restart: on-failure:10
    depends_on:
    - influxdb
    networks:
    - tipi_main_network
  telegraf:
    image: telegraf
    links:
    - influxdb
    volumes:
    - ${APP_DATA_DIR}/telegraf_portainer_Files_AppData_Config_telegraf_mytelegraf.conf:/etc/telegraf/telegraf.conf
    env_file:
    - /portainer/Files/AppData/Config/telegraf/influxv2.env
    environment:
    - DOCKER_INFLUXDB_INIT_ORG=myorg
    - DOCKER_INFLUXDB_INIT_BUCKET=mybucket
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken
    depends_on:
    - influxdb_cli
    restart: unless-stopped
    networks:
    - tipi_main_network
volumes:
  influxdb2: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
