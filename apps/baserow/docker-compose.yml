services:
  baserow:
    image: baserow/baserow:1.22.3
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - BASEROW_PUBLIC_URL=
    volumes:
    - ${APP_DATA_DIR}/baserow_data:/baserow/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
