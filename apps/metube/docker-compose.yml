services:
  metube:
    image: alexta69/metube:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    volumes:
    - ${APP_DATA_DIR}/downloads:/downloads
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8081
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
