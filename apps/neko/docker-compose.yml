networks:
  default:
    attachable: 'true'
    name: ${NEKO_ROOMS_TRAEFIK_NETWORK}
  tipi_main_network:
    external: true
services:
  traefik:
    image: traefik:2.4
    restart: unless-stopped
    environment:
    - TZ
    ports:
    - 580:80
    - 5443:443
    volumes:
    - ${APP_DATA_DIR}/traefik_var_run_docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_traefik_traefik.yml:/etc/traefik/traefik.yml
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_traefik_usersfile:/usersfile
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_traefik_acme.json:/acme.json
    - ${APP_DATA_DIR}/traefik_portainer_Files_AppData_Config_traefik_config:/config
    networks:
    - tipi_main_network
  neko-rooms:
    image: m1k1o/neko-rooms:latest
    restart: unless-stopped
    environment:
    - TZ
    - NEKO_ROOMS_EPR
    - NEKO_ROOMS_NAT1TO1
    - NEKO_ROOMS_TRAEFIK_DOMAIN
    - NEKO_ROOMS_TRAEFIK_ENTRYPOINT
    - NEKO_ROOMS_TRAEFIK_CERTRESOLVER
    - NEKO_ROOMS_TRAEFIK_NETWORK
    volumes:
    - ${APP_DATA_DIR}/neko-rooms_var_run_docker.sock:/var/run/docker.sock
    labels:
    - traefik.enable=true
    - traefik.http.services.neko-rooms-frontend.loadbalancer.server.port=8080
    - traefik.http.routers.neko-rooms.entrypoints=${NEKO_ROOMS_TRAEFIK_ENTRYPOINT}
    - traefik.http.routers.neko-rooms.rule=Host(`${NEKO_ROOMS_TRAEFIK_DOMAIN}`)
    - traefik.http.routers.neko-rooms.tls=true
    - traefik.http.routers.neko-rooms.tls.certresolver=${NEKO_ROOMS_TRAEFIK_CERTRESOLVER}
    - traefik.http.routers.neko-rooms.middlewares=basicauth@file
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
