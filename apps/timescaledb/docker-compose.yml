name: timescaledb
services:
  timescaledb:
    image: timescale/timescaledb:2.28.3-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data
    volumes:
    - ${APP_DATA_DIR}/timescaledb_tsdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5432
volumes:
  tsdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
