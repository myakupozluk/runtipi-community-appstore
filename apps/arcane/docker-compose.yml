services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    volumes:
    - ${APP_DATA_DIR}/arcane_var_run_docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/arcane_arcane-data:/app/data
    - ${APP_DATA_DIR}/arcane_portainer_Files_AppData_Config_arcane_projects:/app/data/projects
    environment:
    - APP_URL=http://localhost:3552
    - PUID=1000
    - PGID=1000
    - ENCRYPTION_KEY=ec5019c954f3bbbb13b7ee62123594908718ad0dcaac2908501436c26d0beb57
    - JWT_SECRET=08cfa58367486132fd2dcf14d06bad5347625def217588ec067486b7ad75613e
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3552
volumes:
  arcane-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
