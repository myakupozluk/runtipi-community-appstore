services:
  postgresql:
    image: postgres:12-alpine
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/postgresql_database:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=${PG_PASS:?database password required}
    - POSTGRES_USER=${PG_USER:-authentik}
    - POSTGRES_DB=${PG_DB:-authentik}
    env_file:
    - .env
    networks:
    - tipi_main_network
  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2021.12.5}
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    volumes:
    - ${APP_DATA_DIR}/server_media:/media
    - ${APP_DATA_DIR}/server_custom-templates:/templates
    - ${APP_DATA_DIR}/server_geoip:/geoip
    env_file:
    - .env
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 9000
  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2021.12.5}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    user: root
    volumes:
    - ${APP_DATA_DIR}/worker_backups:/backups
    - ${APP_DATA_DIR}/worker_media:/media
    - ${APP_DATA_DIR}/worker_certs:/certs
    - ${APP_DATA_DIR}/worker_var_run_docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/worker_custom-templates:/templates
    - ${APP_DATA_DIR}/worker_geoip:/geoip
    env_file:
    - .env
    networks:
    - tipi_main_network
  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    volumes:
    - ${APP_DATA_DIR}/geoipupdate_geoip:/usr/share/GeoIP
    environment:
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: '8'
    env_file:
    - .env
    restart: unless-stopped
    networks:
    - tipi_main_network
volumes:
  database:
    driver: local
  geoip:
    driver: local
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
