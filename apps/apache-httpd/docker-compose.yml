services:
  apache-httpd:
    image: httpd:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    volumes:
    - ${APP_DATA_DIR}/usr_local_apache2_htdocs:/usr/local/apache2/htdocs/
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
