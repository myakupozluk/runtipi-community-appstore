services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - BASE_URL=http://localhost:9017
    - INSTANCE_NAME=my-instance
    volumes:
    - ${APP_DATA_DIR}/etc_searxng:/etc/searxng
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
