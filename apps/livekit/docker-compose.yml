name: livekit
services:
  livekit:
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: "port: 5000\nrtc:\n  tcp_port: 7881\n  udp_port: 7882\n  use_external_ip:\
        \ true\nkeys:\n  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}\n"
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
