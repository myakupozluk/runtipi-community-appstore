services:
  actual-server:
    volumes:
    - ${APP_DATA_DIR}/actual-server_portainer_Files_AppData_Config_actual:/data
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5006
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
