name: mysql
services:
  mysql:
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/mysql_mysqldata:/var/lib/mysql
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3306
volumes:
  mysqldata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
