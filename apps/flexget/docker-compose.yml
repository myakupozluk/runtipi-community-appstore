services:
  flexget:
    image: linuxserver/flexget:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - FG_LOG_LEVEL=info
    - FG_LOG_FILE=/config/flexget.log
    - FG_CONFIG_FILE=/config/.flexget/config.yml
    - FG_WEBUI_PASSWORD=info
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5050
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
