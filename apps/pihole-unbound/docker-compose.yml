services:
  pihole-unbound:
    image: cbcrowe/pihole-unbound:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - ServerIP=192.168.0.X
    - TZ=Europe\London
    - DNSSEC=
    - DNS1=127.0.0.1#5335
    - DNS2=127.0.0.1#5335
    volumes:
    - ${APP_DATA_DIR}/etc_pihole:/etc/pihole
    - ${APP_DATA_DIR}/etc_dnsmasq.d:/etc/dnsmasq.d
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 53
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
