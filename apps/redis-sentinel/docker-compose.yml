name: redis-sentinel
services:
  redis-master:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
      REDIS_ANNOUNCE_HOST: redis-master
    volumes:
    - ${APP_DATA_DIR}/redis-master_master-data:/data
    networks:
    - tipi_main_network
  redis-replica-1:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: replica
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
      REDIS_ANNOUNCE_HOST: redis-replica-1
    depends_on:
    - redis-master
    volumes:
    - ${APP_DATA_DIR}/redis-replica-1_replica1-data:/data
    networks:
    - tipi_main_network
  redis-replica-2:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: replica
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
      REDIS_ANNOUNCE_HOST: redis-replica-2
    depends_on:
    - redis-master
    volumes:
    - ${APP_DATA_DIR}/redis-replica-2_replica2-data:/data
    networks:
    - tipi_main_network
  redis-sentinel-1:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: sentinel
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
    depends_on:
    - redis-master
    - redis-replica-1
    - redis-replica-2
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 8080
  redis-sentinel-2:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: sentinel
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
    depends_on:
    - redis-master
    - redis-replica-1
    - redis-replica-2
    networks:
    - tipi_main_network
    volumes: []
  redis-sentinel-3:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: sentinel
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: redis-master
    depends_on:
    - redis-master
    - redis-replica-1
    - redis-replica-2
    networks:
    - tipi_main_network
    volumes: []
volumes:
  master-data: null
  replica1-data: null
  replica2-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
