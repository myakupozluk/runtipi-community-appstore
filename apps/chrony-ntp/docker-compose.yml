services:
  chrony-ntp:
    image: cturra/ntp:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - LOG_LEVEL=0
    - NTP_SERVERS=time.cloudflare.com
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 123
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
