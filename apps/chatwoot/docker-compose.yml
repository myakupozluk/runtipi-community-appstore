name: chatwoot
x-chatwoot:
  image: chatwoot/chatwoot:v4.15.1-ce
  restart: unless-stopped
x-chatwoot-env: &id001
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: 'true'
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: chatwoot-local-only
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://broker:6379
  REDIS_PASSWORD: ${REDIS_AUTH}
  ACTIVE_STORAGE_SERVICE: local
  ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-true}
  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-Chatwoot <support@example.com>}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
services:
  web:
    image: chatwoot/chatwoot:v4.15.1-ce
    restart: unless-stopped
    command:
    - bundle
    - exec
    - rails
    - s
    - -b
    - 0.0.0.0
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: 'true'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: chatwoot-local-only
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://broker:6379
      REDIS_PASSWORD: ${REDIS_AUTH}
      ACTIVE_STORAGE_SERVICE: local
      ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-true}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-Chatwoot <support@example.com>}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PORT: '5000'
    volumes:
    - ${APP_DATA_DIR}/web_storage:/app/storage
    depends_on:
    - db
    - broker
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  worker:
    image: chatwoot/chatwoot:v4.15.1-ce
    restart: unless-stopped
    command:
    - bundle
    - exec
    - sidekiq
    - -C
    - config/sidekiq.yml
    environment: *id001
    volumes:
    - ${APP_DATA_DIR}/worker_storage:/app/storage
    depends_on:
    - db
    - broker
    networks:
    - tipi_main_network
  migrate:
    image: chatwoot/chatwoot:v4.15.1-ce
    restart: unless-stopped
    command:
    - sh
    - -c
    - bundle exec rails db:chatwoot_prepare && sleep infinity
    environment: *id001
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
  broker:
    image: valkey/valkey:8
    command:
    - sh
    - -c
    - exec valkey-server --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_AUTH}
    restart: unless-stopped
    ports:
    - '6379'
    networks:
    - tipi_main_network
    volumes: []
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
    - '5432'
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot-local-only
      POSTGRES_DB: chatwoot
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  storage: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
