services:
  proxitok-redis:
    image: redis
    command: redis-server --save 60 1 --loglevel warning
    hostname: proxitok-redis
    mem_limit: 256m
    cpu_shares: 768
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 1026:100
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping || exit 1
    restart: on-failure:5
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 8080
  proxitok-signer:
    image: ghcr.io/pablouser1/signtok:master
    hostname: proxitok-signer
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
    restart: on-failure:5
    networks:
    - tipi_main_network
    volumes: []
  proxitok:
    image: ghcr.io/pablouser1/proxitok:master
    hostname: proxitok
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: stat /etc/passwd || exit 1
    ports:
    - 9770:80
    volumes:
    - ${APP_DATA_DIR}/proxitok_portainer_Files_AppData_Config_proxitok-cache:/cache
    environment:
      LATTE_CACHE: /cache
      API_CACHE: redis
      REDIS_HOST: proxitok-redis
      REDIS_PORT: 6379
      API_SIGNER: remote
      API_SIGNER_URL: http://proxitok-signer:8080/signature
    restart: on-failure:5
    depends_on:
      proxitok-redis:
        condition: service_healthy
      proxitok-signer:
        condition: service_healthy
    networks:
    - tipi_main_network
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
