name: twenty
x-twenty-env:
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  SERVER_URL: ${SERVER_URL:-http://localhost:5000}
  PG_DATABASE_URL: postgres://twenty:twenty-local-only@db:5432/twenty
  REDIS_URL: redis://broker:6379
  STORAGE_TYPE: local
services:
  server:
    image: twentycrm/twenty:v2
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SERVER_URL: ${SERVER_URL:-http://localhost:5000}
      PG_DATABASE_URL: postgres://twenty:twenty-local-only@db:5432/twenty
      REDIS_URL: redis://broker:6379
      STORAGE_TYPE: local
      NODE_PORT: '5000'
    volumes:
    - ${APP_DATA_DIR}/server_serverdata:/app/packages/twenty-server/.local-storage
    depends_on:
    - db
    - broker
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
  worker:
    image: twentycrm/twenty:v2
    restart: unless-stopped
    command:
    - yarn
    - worker:prod
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SERVER_URL: ${SERVER_URL:-http://localhost:5000}
      PG_DATABASE_URL: postgres://twenty:twenty-local-only@db:5432/twenty
      REDIS_URL: redis://broker:6379
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
    - ${APP_DATA_DIR}/worker_serverdata:/app/packages/twenty-server/.local-storage
    depends_on:
    - db
    - broker
    networks:
    - tipi_main_network
  broker:
    build: ./broker
    restart: unless-stopped
    networks:
    - tipi_main_network
    volumes: []
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty-local-only
      POSTGRES_DB: twenty
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  serverdata: null
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
