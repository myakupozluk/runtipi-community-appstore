services:
  midarr:
    build: .
    volumes:
    - ${APP_DATA_DIR}/midarr_portainer_Files_AppData_Config_midarr:/app
    - ${APP_DATA_DIR}/midarr_portainer_Files_AppData_Config_midarr_movies:/movies
    - ${APP_DATA_DIR}/midarr_portainer_Files_AppData_Config_midarr_series:/series
    environment:
    - APP_URL=http://midarr:4000
    - SETUP_ADMIN_EMAIL=admin@email.com
    - SETUP_ADMIN_NAME=admin
    - SETUP_ADMIN_PASSWORD=passwordpassword
    - RADARR_BASE_URL=http://radarr:7878
    - RADARR_API_KEY=d031e8c9b9df4b2fab311d1c3b3fa2c5
    - SONARR_BASE_URL=http://sonarr:8989
    - SONARR_API_KEY=1accda4476394bfcaddefe8c4fd77d4a
    command: bash -c "chmod u+x misc/entry-point-local.sh && ./misc/entry-point-local.sh"
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
