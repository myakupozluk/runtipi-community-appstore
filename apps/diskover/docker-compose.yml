services:
  diskover:
    image: linuxserver/diskover:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - ES_HOST=elasticsearch
    - ES_PORT=9200
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
