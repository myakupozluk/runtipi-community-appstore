services:
  ldap-auth:
    image: linuxserver/ldap-auth:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - FERNETKEY=
    - CERTFILE=
    - KEYFILE=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8888
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
