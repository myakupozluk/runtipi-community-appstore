services:
  wireguard:
    image: linuxserver/wireguard:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SERVERURL=wireguard.domain.com
    - SERVERPORT=51820
    - PEERS=1
    - PEERDNS=auto
    - INTERNAL_SUBNET=10.13.13.0
    - ALLOWEDIPS=0.0.0.0/0
    - PERSISTENTKEEPALIVE_PEERS=
    - LOG_CONFS=true
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/lib_modules:/lib/modules
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 51820
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
