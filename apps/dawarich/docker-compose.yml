networks:
  dawarich: null
  tipi_main_network:
    external: true
services:
  dawarich_redis:
    image: redis:7.0-alpine
    command: redis-server
    networks:
    - dawarich
    - tipi_main_network
    volumes:
    - ${APP_DATA_DIR}/dawarich_redis_portainer_Files_AppData_Config_dawarich_shared:/data
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    x-runtipi:
      is_main: true
      internal_port: 8080
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    shm_size: 1G
    volumes:
    - ${APP_DATA_DIR}/dawarich_db_portainer_Files_AppData_Config_dawarich_dawarich_db_data:/var/lib/postgresql/data
    - ${APP_DATA_DIR}/dawarich_db_portainer_Files_AppData_Config_dawarich_shared:/var/shared
    networks:
    - dawarich
    - tipi_main_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dawarich_development
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  dawarich_app:
    image: freikin/dawarich:latest
    volumes:
    - ${APP_DATA_DIR}/dawarich_app_portainer_Files_AppData_Config_dawarich_public:/var/app/public
    - ${APP_DATA_DIR}/dawarich_app_portainer_Files_AppData_Config_dawarich_watched:/var/app/tmp/imports/watched
    - ${APP_DATA_DIR}/dawarich_app_portainer_Files_AppData_Config_dawarich_storage:/var/app/storage
    networks:
    - dawarich
    - tipi_main_network
    ports:
    - 3000:3000
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command:
    - bin/rails
    - server
    - -p
    - '3000'
    - -b
    - '::'
    restart: on-failure
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://dawarich_redis:6379/0
      DATABASE_HOST: dawarich_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: dawarich_development
      MIN_MINUTES_SPENT_IN_CITY: 60
      APPLICATION_HOSTS: localhost
      TIME_ZONE: Europe/Athens
      APPLICATION_PROTOCOL: http
      DISTANCE_UNIT: km
      PROMETHEUS_EXPORTER_ENABLED: false
      PROMETHEUS_EXPORTER_HOST: 0.0.0.0
      PROMETHEUS_EXPORTER_PORT: 9394
      SELF_HOSTED: 'true'
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '"status"\s*:\s*"ok"'
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 4G
  dawarich_sidekiq:
    image: freikin/dawarich:latest
    volumes:
    - ${APP_DATA_DIR}/dawarich_sidekiq_portainer_Files_AppData_Config_dawarich_public:/var/app/public
    - ${APP_DATA_DIR}/dawarich_sidekiq_portainer_Files_AppData_Config_dawarich_watched:/var/app/tmp/imports/watched
    - ${APP_DATA_DIR}/dawarich_sidekiq_portainer_Files_AppData_Config_dawarich_storage:/var/app/storage
    networks:
    - dawarich
    - tipi_main_network
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command:
    - sidekiq
    restart: on-failure
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://dawarich_redis:6379/0
      DATABASE_HOST: dawarich_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: dawarich_development
      APPLICATION_HOSTS: localhost
      BACKGROUND_PROCESSING_CONCURRENCY: 10
      APPLICATION_PROTOCOL: http
      DISTANCE_UNIT: km
      PROMETHEUS_EXPORTER_ENABLED: false
      PROMETHEUS_EXPORTER_HOST: dawarich_app
      PROMETHEUS_EXPORTER_PORT: 9394
      SELF_HOSTED: 'true'
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - bundle exec sidekiqmon processes | grep $${HOSTNAME}
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 4G
x-runtipi:
  schema_version: 2
