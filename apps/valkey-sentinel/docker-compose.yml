name: valkey-sentinel
services:
  valkey-master:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: master
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
      VALKEY_ANNOUNCE_HOST: valkey-master
    volumes:
    - ${APP_DATA_DIR}/valkey-master_master-data:/data
    networks:
    - tipi_main_network
  valkey-replica-1:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: replica
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
      VALKEY_ANNOUNCE_HOST: valkey-replica-1
    depends_on:
    - valkey-master
    volumes:
    - ${APP_DATA_DIR}/valkey-replica-1_replica1-data:/data
    networks:
    - tipi_main_network
  valkey-replica-2:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: replica
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
      VALKEY_ANNOUNCE_HOST: valkey-replica-2
    depends_on:
    - valkey-master
    volumes:
    - ${APP_DATA_DIR}/valkey-replica-2_replica2-data:/data
    networks:
    - tipi_main_network
  valkey-sentinel-1:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: sentinel
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
    depends_on:
    - valkey-master
    - valkey-replica-1
    - valkey-replica-2
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 8080
  valkey-sentinel-2:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: sentinel
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
    depends_on:
    - valkey-master
    - valkey-replica-1
    - valkey-replica-2
    networks:
    - tipi_main_network
    volumes: []
  valkey-sentinel-3:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_ROLE: sentinel
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MASTER_HOST: valkey-master
    depends_on:
    - valkey-master
    - valkey-replica-1
    - valkey-replica-2
    networks:
    - tipi_main_network
    volumes: []
volumes:
  master-data: null
  replica1-data: null
  replica2-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
