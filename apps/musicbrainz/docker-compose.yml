services:
  musicbrainz:
    image: linuxserver/musicbrainz:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - BRAINZCODE=
    - PUID=1000
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
