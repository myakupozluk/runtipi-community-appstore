name: valkey
services:
  valkey:
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    build: .
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/valkey_valkeydata:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 6379
volumes:
  valkeydata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
