services:
  ghost:
    image: ghost:latest
    restart: always
    depends_on:
    - ghost-db
    environment:
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: root
      database__connection__password: example
      database__connection__database: ghost
      url: http://localhost:8080
    volumes:
    - ${APP_DATA_DIR}/ghost_portainer_Files_AppData_Config_ghost:/var/lib/ghost/content
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 2368
  ghost-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
    networks:
    - tipi_main_network
    volumes: []
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
