services:
  unifi-network-application:
    image: linuxserver/unifi-network-application:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - MONGO_USER=unifi
    - MONGO_PASS=
    - MONGO_HOST=unifi-db
    - MONGO_PORT=27017
    - MONGO_DBNAME=unifi
    - MONGO_AUTHSOURCE=admin
    - MEM_LIMIT=1024
    - MEM_STARTUP=1024
    - MONGO_TLS=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8443
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
