name: redis-cluster
services:
  redis-node-1:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-1
    volumes:
    - ${APP_DATA_DIR}/redis-node-1_node1-data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8080
  redis-node-2:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-2
    volumes:
    - ${APP_DATA_DIR}/redis-node-2_node2-data:/data
    networks:
    - tipi_main_network
  redis-node-3:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-3
    volumes:
    - ${APP_DATA_DIR}/redis-node-3_node3-data:/data
    networks:
    - tipi_main_network
  redis-node-4:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-4
    volumes:
    - ${APP_DATA_DIR}/redis-node-4_node4-data:/data
    networks:
    - tipi_main_network
  redis-node-5:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-5
    volumes:
    - ${APP_DATA_DIR}/redis-node-5_node5-data:/data
    networks:
    - tipi_main_network
  redis-node-6:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ROLE: node
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ANNOUNCE_HOST: redis-node-6
    volumes:
    - ${APP_DATA_DIR}/redis-node-6_node6-data:/data
    networks:
    - tipi_main_network
  redis-init:
    build: .
    restart: 'no'
    environment:
      REDIS_ROLE: init
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CLUSTER_NODES: redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379
        redis-node-5:6379 redis-node-6:6379
    depends_on:
    - redis-node-1
    - redis-node-2
    - redis-node-3
    - redis-node-4
    - redis-node-5
    - redis-node-6
    networks:
    - tipi_main_network
    volumes: []
volumes:
  node1-data: null
  node2-data: null
  node3-data: null
  node4-data: null
  node5-data: null
  node6-data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
