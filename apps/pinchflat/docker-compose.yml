services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    environment:
    - TZ=Europe/Athens
    volumes:
    - ${APP_DATA_DIR}/pinchflat_portainer_Files_AppData_Config_pinchflat:/config
    - ${APP_DATA_DIR}/pinchflat_portainer_Files_AppData_Config_pinchflat_downloads:/downloads
    restart: unless-stopped
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8945
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
