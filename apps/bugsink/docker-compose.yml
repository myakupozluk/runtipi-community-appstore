name: bugsink
services:
  bugsink:
    image: bugsink/bugsink:2.4.0
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CREATE_SUPERUSER: ${ADMIN_EMAIL}:${ADMIN_PASSWORD}
      DATABASE_URL: postgres://bugsink:bugsink-local-only@db:5432/bugsink
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      PORT: '5000'
      BEHIND_HTTPS_PROXY: 'false'
    depends_on:
    - db
    networks:
    - tipi_main_network
    volumes: []
    x-runtipi:
      is_main: true
      internal_port: 5000
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink-local-only
      POSTGRES_DB: bugsink
    volumes:
    - ${APP_DATA_DIR}/db_dbdata:/var/lib/postgresql/data
    networks:
    - tipi_main_network
volumes:
  dbdata: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
