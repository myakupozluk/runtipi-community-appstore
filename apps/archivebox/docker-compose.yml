services:
  archivebox:
    image: archivebox/archivebox:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - ALLOWED_HOSTS=*
    - MEDIA_MAX_SIZE=750m
    - PUBLIC_INDEX=true
    - PUBLIC_SNAPSHOTS=true
    - PUBLIC_ADD_VIEW=false
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
