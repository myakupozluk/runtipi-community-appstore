services:
  paste-bin:
    image: ghcr.io/enchant97/hasty-paste:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/paste-bin_portainer_Files_AppData_Config_hasty-paste:/app/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
volumes:
  data: null
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
