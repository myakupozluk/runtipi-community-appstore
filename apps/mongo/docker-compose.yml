services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APP_DATA_DIR}/data_db:/data/db
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 27017
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
