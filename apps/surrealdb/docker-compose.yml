services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - SDB_USERNAME=default_username
    - SDB_PASSWORD=default_password
    volumes:
    - ${APP_DATA_DIR}/data:/data
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8000
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
