services:
  openvpn-as:
    image: linuxserver/openvpn-as:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - INTERFACE=eth0
    - PUID=1000
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/config:/config
    networks:
    - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 943
networks:
  tipi_main_network:
    external: true
x-runtipi:
  schema_version: 2
